name: kivi

x-app: &app
  image: kivi:local
  build: .
  init: true
  networks: [application]
  # Docker Desktop resolves this name itself; host-gateway supplies the same mapping on Linux.
  # Ollama remains on the host loopback interface rather than becoming a Compose service.
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-runtime-environment: &runtime-environment
  KIVI_DB_HOST: db
  KIVI_DB_NAME: kivi
  KIVI_DB_USER: kivi_app
  KIVI_DB_PASSWORD: ${KIVI_APP_PASSWORD:?Copy .env.example to .env and set passwords}
  KIVI_RESPONSE_MODEL: ${KIVI_RESPONSE_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
  KIVI_REVIEWER_INFERENCE_APPROVED: ${KIVI_REVIEWER_INFERENCE_APPROVED:-false}
  KIVI_REVIEWER_DATA_POLICY_ACK: ${KIVI_REVIEWER_DATA_POLICY_ACK:-}
  KIVI_MAX_REQUESTS: ${KIVI_MAX_REQUESTS:-1100}
  KIVI_MAX_TOTAL_TOKENS: ${KIVI_MAX_TOTAL_TOKENS:-10000000}
  # Google is the normal demo route. Set this explicitly to ollama to use the local backup.
  KIVI_INFERENCE_PROVIDER: ${KIVI_INFERENCE_PROVIDER:-google}
  KIVI_FREE_SYNTHETIC_TRIAL_APPROVED: ${KIVI_FREE_SYNTHETIC_TRIAL_APPROVED:-false}
  KIVI_FREE_SYNTHETIC_QUESTIONS_APPROVED: ${KIVI_FREE_SYNTHETIC_QUESTIONS_APPROVED:-false}
  KIVI_FREE_SYNTHETIC_SOURCES_APPROVED: ${KIVI_FREE_SYNTHETIC_SOURCES_APPROVED:-false}
  KIVI_PRIVATE_DIRECT_APPROVED: ${KIVI_PRIVATE_DIRECT_APPROVED:-false}
  KIVI_FREE_DATA_POLICY_ACK: ${KIVI_FREE_DATA_POLICY_ACK:-}
  KIVI_FREE_EXTRACTOR_MODEL: ${KIVI_FREE_EXTRACTOR_MODEL:-gemini-3.5-flash-lite}
  KIVI_FREE_RESPONDER_MODEL: ${KIVI_FREE_RESPONDER_MODEL:-gemini-3.5-flash-lite}
  # Local-only Ollama backup. Its Python configuration accepts only this host gateway and /v1.
  KIVI_OLLAMA_ENABLED: ${KIVI_OLLAMA_ENABLED:-false}
  KIVI_OLLAMA_BASE_URL: "${KIVI_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}"
  KIVI_OLLAMA_API_KEY: ${KIVI_OLLAMA_API_KEY:-ollama}
  KIVI_OLLAMA_EXTRACTOR_MODEL: ${KIVI_OLLAMA_EXTRACTOR_MODEL:-qwen3:4b}
  KIVI_OLLAMA_RESPONDER_MODEL: ${KIVI_OLLAMA_RESPONDER_MODEL:-qwen3:4b}
  # Declared for a future retrieval experiment only; the application does not call embeddings.
  KIVI_OLLAMA_EMBEDDING_MODEL: ${KIVI_OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
  KIVI_OLLAMA_PRIVATE_DIRECT: ${KIVI_OLLAMA_PRIVATE_DIRECT:-false}

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: kivi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${KIVI_POSTGRES_PASSWORD:?Set KIVI_POSTGRES_PASSWORD in .env}
      APP_USER: kivi_app
      APP_PASSWORD: ${KIVI_APP_PASSWORD:?Set KIVI_APP_PASSWORD in .env}
      MIGRATION_USER: kivi_migrate
      MIGRATION_PASSWORD: ${KIVI_MIGRATION_PASSWORD:?Set KIVI_MIGRATION_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/10-kivi.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d kivi']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [application]

  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    environment:
      <<: *runtime-environment
      KIVI_DB_USER: kivi_migrate
      KIVI_DB_PASSWORD: ${KIVI_MIGRATION_PASSWORD:?Set KIVI_MIGRATION_PASSWORD in .env}
    depends_on:
      db: {condition: service_healthy}

  api:
    <<: *app
    logging: {driver: none}
    environment:
      <<: *runtime-environment
      KIVI_S07_SYNTHETIC_TRIAL_APPROVED: ${KIVI_S07_SYNTHETIC_TRIAL_APPROVED:-false}
      KIMI_K3_API_KEY: ${KIMI_K3_API_KEY:-}
      NEMOTRON_30B_API_KEY: ${NEMOTRON_30B_API_KEY:-}
      POOLSIDE_LAGUNA_XS_2P1: ${POOLSIDE_LAGUNA_XS_2P1:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GOOGLE_API_KEY_FREE_TIER: ${GOOGLE_API_KEY_FREE_TIER:-}
      OPEN_ROUTER_API_KEY: ${OPEN_ROUTER_API_KEY:-}
    ports: ['127.0.0.1:${KIVI_API_PORT:-8000}:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, kivi, ready]
      interval: 5s
      timeout: 10s
      retries: 12

  cli:
    <<: *app
    logging: {driver: none}
    profiles: [tools]
    entrypoint: [kivi]
    command: [ready]
    environment:
      <<: *runtime-environment
      KIVI_S07_SYNTHETIC_TRIAL_APPROVED: ${KIVI_S07_SYNTHETIC_TRIAL_APPROVED:-false}
      KIMI_K3_API_KEY: ${KIMI_K3_API_KEY:-}
      NEMOTRON_30B_API_KEY: ${NEMOTRON_30B_API_KEY:-}
      POOLSIDE_LAGUNA_XS_2P1: ${POOLSIDE_LAGUNA_XS_2P1:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GOOGLE_API_KEY_FREE_TIER: ${GOOGLE_API_KEY_FREE_TIER:-}
      OPEN_ROUTER_API_KEY: ${OPEN_ROUTER_API_KEY:-}
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    <<: *app
    logging: {driver: none}
    command: [kivi, worker]
    environment:
      <<: *runtime-environment
      KIVI_S07_SYNTHETIC_TRIAL_APPROVED: ${KIVI_S07_SYNTHETIC_TRIAL_APPROVED:-false}
      NEMOTRON_30B_API_KEY: ${NEMOTRON_30B_API_KEY:-}
      POOLSIDE_LAGUNA_XS_2P1: ${POOLSIDE_LAGUNA_XS_2P1:-}
      KIMI_K3_API_KEY: ${KIMI_K3_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GOOGLE_API_KEY_FREE_TIER: ${GOOGLE_API_KEY_FREE_TIER:-}
      OPEN_ROUTER_API_KEY: ${OPEN_ROUTER_API_KEY:-}
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  database:

networks:
  application:
