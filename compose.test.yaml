# Standalone test project: no application services, credentials, network, or volume.
name: kivi-tests

services:
  test-db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: kivi_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: synthetic-test-admin
      APP_USER: kivi_test_app
      APP_PASSWORD: synthetic-test-runtime
      MIGRATION_USER: kivi_test_migrate
      MIGRATION_PASSWORD: synthetic-test-migration
    volumes:
      - test-database:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/10-kivi.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d kivi_test']
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    image: kivi:local
    build: .
    init: true
    environment:
      KIVI_ENV: test
      KIVI_DB_HOST: test-db
      KIVI_DB_NAME: kivi_test
      KIVI_DB_USER: kivi_test_app
      KIVI_DB_PASSWORD: synthetic-test-runtime
      KIVI_TEST_MIGRATION_PASSWORD: synthetic-test-migration
    depends_on:
      test-db: {condition: service_healthy}
    command: [pytest, -q, -p, no:cacheprovider]

volumes:
  test-database:
