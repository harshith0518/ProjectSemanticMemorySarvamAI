<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1972" viewBox="0 0 2000 1972" role="img" aria-labelledby="title desc"><title id="title">Learn useful memories from evidence</title><desc id="desc">Preserve useful meaning without inventing personal facts. Permitted sources remain searchable when extraction skips them. Unbuilt: worker, extraction contract, semantic checks and admission operations. Review remember/ignore/uncertain examples; test candidates against exact evidence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfa"/><text x="72" y="53" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">GOLDEN GOOSE / MENTOR REVIEW / 03</tspan></text><text x="72" y="119" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700"><tspan x="72" dy="0">Learn useful memories from evidence</tspan></text><text x="72" y="164" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="72" dy="0">Extraction proposes claims; admission decides what to preserve.</tspan></text><rect x="72" y="190.4" width="1856" height="46" rx="7" fill="#fff0cf" stroke="#fff0cf" stroke-width="1.5"/><text x="88" y="216.4" fill="#73501b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="88" dy="0">STATUS: REVIEWED PLAN • APPLICATION IMPLEMENTATION PENDING • TARGETS ARE NOT MEASURED RESULTS</tspan></text><text x="72" y="284.4" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="72" dy="0">Preserve useful meaning without inventing personal facts. Permitted sources remain searchable when extraction skips them.</tspan></text><text x="72" y="338.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">PROCESS / READ THE NUMBERED STEPS</tspan></text><rect x="72.0" y="358.15" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96.0" dy="0">01</tspan></text><text x="96.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Read permitted input</tspan></text><text x="96.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96.0" dy="0">A background worker reads a source revision and</tspan><tspan x="96.0" dy="32.400000000000006">justified context. Learning from live input waits until</tspan><tspan x="96.0" dy="32.400000000000006">current controls resolve.</tspan></text><rect x="700.0" y="358.15" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="724.0" dy="0">02</tspan></text><text x="724.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Propose small claims</tspan></text><text x="724.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="724.0" dy="0">Extract speaker, subject, scope, time, negation,</tspan><tspan x="724.0" dy="32.400000000000006">uncertainty and exact support. Keep plans, beliefs</tspan><tspan x="724.0" dy="32.400000000000006">and quotations qualified.</tspan></text><rect x="1328.0" y="358.15" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1352.0" dy="0">03</tspan></text><text x="1352.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Check support and policy</tspan></text><text x="1352.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1352.0" dy="0">Validate fields and evidence spans, compare related</tspan><tspan x="1352.0" dy="32.400000000000006">assertions, and apply versioned admission rules.</tspan><tspan x="1352.0" dy="32.400000000000006">Valid JSON does not establish truthful</tspan><tspan x="1352.0" dy="32.400000000000006">interpretation.</tspan></text><rect x="1328.0" y="676.75" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="716.75" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1352.0" dy="0">04</tspan></text><text x="1352.0" y="757.75" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Choose an outcome</tspan></text><text x="1352.0" y="799.75" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1352.0" dy="0">Add; apply a supported change; link independent</tspan><tspan x="1352.0" dy="32.400000000000006">evidence; record duplicate; preserve conflict; or</tspan><tspan x="1352.0" dy="32.400000000000006">reject. Rejected memories do not hide permitted</tspan><tspan x="1352.0" dy="32.400000000000006">sources.</tspan></text><rect x="700.0" y="676.75" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="716.75" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="724.0" dy="0">05</tspan></text><text x="724.0" y="757.75" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Commit safely</tspan></text><text x="724.0" y="799.75" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="724.0" dy="0">Commit accepted claims and index jobs together.</tspan><tspan x="724.0" dy="32.400000000000006">Record concise reasons and versions; reject stale</tspan><tspan x="724.0" dy="32.400000000000006">worker attempts. Empty extraction differs from</tspan><tspan x="724.0" dy="32.400000000000006">provider failure.</tspan></text><path d="M 672.0,486.45 L 700.0,486.45" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1300.0,486.45 L 1328.0,486.45" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1628.0,614.75 L 1628.0,676.75" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1328.0,805.05 L 1300.0,805.05" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><rect x="72.0" y="967.35" width="600.0" height="418.45000000000005" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="1017.35" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">What a candidate contains</tspan></text><text x="95.0" y="1066.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1066.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Meaning: knowledge, an episode, or an authorized</tspan><tspan x="115.0" dy="31.05">reusable procedure; primary category and optional</tspan><tspan x="115.0" dy="31.05">labels.</tspan></text><text x="95.0" y="1174.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1174.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Attribution: speaker, subject, and whether directly</tspan><tspan x="115.0" dy="31.05">stated, inferred, summarized or observed.</tspan></text><text x="95.0" y="1251.6" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1251.6" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Evidence: source ID, revision and exact span;</tspan><tspan x="115.0" dy="31.05">dependencies allow correction and forgetting to</tspan><tspan x="115.0" dy="31.05">invalidate interpretations.</tspan></text><rect x="700.0" y="967.35" width="600.0" height="418.45000000000005" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="1017.35" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">What must stay qualified</tspan></text><text x="723.0" y="1066.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1066.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">A wish is not an event; a promise is not completion;</tspan><tspan x="743.0" dy="31.05">a quoted instruction is not current authority.</tspan></text><text x="723.0" y="1143.4499999999998" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1143.4499999999998" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Do not infer preferences from visits, personal facts</tspan><tspan x="743.0" dy="31.05">from fiction, or spelling preferences from ASR</tspan><tspan x="743.0" dy="31.05">differences.</tspan></text><text x="723.0" y="1251.6" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1251.6" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Ambiguous identity, date or scope remains</tspan><tspan x="743.0" dy="31.05">unresolved. Record useful attribution instead of</tspan><tspan x="743.0" dy="31.05">inventing missing details.</tspan></text><rect x="1328.0" y="967.35" width="600.0" height="418.45000000000005" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="1017.35" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Policy and proof</tspan></text><text x="1351.0" y="1066.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1066.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Greetings, repetition and boilerplate usually need no</tspan><tspan x="1371.0" dy="31.05">derived memory; source search still covers useful</tspan><tspan x="1371.0" dy="31.05">unclassified material.</tspan></text><text x="1351.0" y="1174.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1174.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Version prompts, model, admission rules and</tspan><tspan x="1371.0" dy="31.05">category registry. Model proposals cannot rewrite</tspan><tspan x="1371.0" dy="31.05">application permissions or policy.</tspan></text><text x="1351.0" y="1282.65" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1282.65" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Sensitive-information policy remains open; measure</tspan><tspan x="1371.0" dy="31.05">unsupported claims, wrong-person assignments</tspan><tspan x="1371.0" dy="31.05">and missed useful memories.</tspan></text><rect x="72" y="1413.8000000000002" width="1856" height="144.8" rx="14" fill="#e1eff4" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1449.8000000000002" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">TERMS IN THIS IMAGE</tspan></text><text x="96" y="1486.8000000000002" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Candidate = a proposed memory. Admission = deciding whether and how to save it. Attribution = who stated or experienced it. Dependencies = the source material that an</tspan><tspan x="96" dy="32.400000000000006">interpretation relies on.</tspan></text><rect x="72" y="1578.6000000000001" width="1856" height="112.4" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1614.6000000000001" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">ILLUSTRATIVE EXAMPLE</tspan></text><text x="96" y="1651.6000000000001" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">“My sister might visit Paris” supports the sister&#x27;s tentative plan, not the user&#x27;s visit or a completed trip. Keep her identity unresolved if unclear.</tspan></text><rect x="72" y="1711.0000000000002" width="1856" height="112.4" rx="14" fill="#fff0cf" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1747.0000000000002" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">REMAINING WORK / DECISION</tspan></text><text x="96" y="1784.0000000000002" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Unbuilt: worker, extraction contract, semantic checks and admission operations. Review remember/ignore/uncertain examples; test candidates against exact evidence.</tspan></text><text x="72" y="1869.4000000000003" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700"><tspan x="72" dy="0">MENTOR DISCUSSION What should Kivi remember automatically, and which uncertain or sensitive details need different treatment?</tspan></text><path d="M 72,1904.8000000000004 L 1928,1904.8000000000004" fill="none" stroke="#ccd9cf" stroke-width="2.5" stroke-linejoin="round"   /><text x="72" y="1937.8000000000004" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="72" dy="0">Source: ARCHITECTURE.md §§3, 7–9; guide 01 | Canonical plan revision 1.1 | 6 September 2026</tspan></text></svg>