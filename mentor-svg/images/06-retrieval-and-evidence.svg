<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2005" viewBox="0 0 2000 2005" role="img" aria-labelledby="title desc"><title id="title">Find evidence sufficient for the question</title><desc id="desc">Recover meaning across records while preserving exact support, current controls and honest completeness limits. Unbuilt: keyword retrieval, evidence bundles, enumeration and freshness checks. Build source search first; justify vectors and relationship expansion through measured gains.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfa"/><text x="72" y="53" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">GOLDEN GOOSE / MENTOR REVIEW / 06</tspan></text><text x="72" y="119" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700"><tspan x="72" dy="0">Find evidence sufficient for the question</tspan></text><text x="72" y="164" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="72" dy="0">Search sources and memories; verify coverage before answering.</tspan></text><rect x="72" y="190.4" width="1856" height="46" rx="7" fill="#fff0cf" stroke="#fff0cf" stroke-width="1.5"/><text x="88" y="216.4" fill="#73501b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="88" dy="0">STATUS: REVIEWED PLAN • APPLICATION IMPLEMENTATION PENDING • TARGETS ARE NOT MEASURED RESULTS</tspan></text><text x="72" y="284.4" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="72" dy="0">Recover meaning across records while preserving exact support, current controls and honest completeness limits.</tspan></text><text x="72" y="338.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">PROCESS / READ THE NUMBERED STEPS</tspan></text><rect x="72.0" y="358.15" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96.0" dy="0">01</tspan></text><text x="96.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Define the read</tspan></text><text x="96.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96.0" dy="0">Use question, scope and relevant time. Apply</tspan><tspan x="96.0" dy="32.400000000000006">trusted ownership, current exclusions and</tspan><tspan x="96.0" dy="32.400000000000006">permitted-text rules to every retrieval route.</tspan></text><rect x="700.0" y="358.15" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="724.0" dy="0">02</tspan></text><text x="724.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Collect candidates</tspan></text><text x="724.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="724.0" dy="0">Start with source keyword search. Optional hybrid</tspan><tspan x="724.0" dy="32.400000000000006">search combines source/memory keyword lists with</tspan><tspan x="724.0" dy="32.400000000000006">vector lists ranking meaning similarity.</tspan></text><rect x="1328.0" y="358.15" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1352.0" dy="0">03</tspan></text><text x="1352.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Combine and inspect</tspan></text><text x="1352.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1352.0" dy="0">Fuse ranked lists and deduplicate overlapping</tspan><tspan x="1352.0" dy="32.400000000000006">evidence. Read original supporting spans; follow</tspan><tspan x="1352.0" dy="32.400000000000006">bounded links or additional reads for missing bridge</tspan><tspan x="1352.0" dy="32.400000000000006">evidence.</tspan></text><rect x="1328.0" y="676.75" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="716.75" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1352.0" dy="0">04</tspan></text><text x="1352.0" y="757.75" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Check completeness</tspan></text><text x="1352.0" y="799.75" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1352.0" dy="0">Counts, complete lists and change histories require</tspan><tspan x="1352.0" dy="32.400000000000006">scoped enumeration plus source fallback for</tspan><tspan x="1352.0" dy="32.400000000000006">extraction gaps. Top-ranked matches alone cannot</tspan><tspan x="1352.0" dy="32.400000000000006">establish completeness.</tspan></text><rect x="700.0" y="676.75" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="716.75" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="724.0" dy="0">05</tspan></text><text x="724.0" y="757.75" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Pack the evidence bundle</tspan></text><text x="724.0" y="799.75" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="724.0" dy="0">Preserve decisive excerpts, interpretations, IDs,</tspan><tspan x="724.0" dy="32.400000000000006">revisions, conflicts and coverage within the token</tspan><tspan x="724.0" dy="32.400000000000006">budget. Return readiness and a store-issued</tspan><tspan x="724.0" dy="32.400000000000006">freshness token.</tspan></text><path d="M 672.0,486.45 L 700.0,486.45" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1300.0,486.45 L 1328.0,486.45" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1628.0,614.75 L 1628.0,676.75" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1328.0,805.05 L 1300.0,805.05" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><rect x="72.0" y="967.35" width="600.0" height="418.45000000000005" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="1017.35" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Proposed budgets; unmeasured</tspan></text><text x="95.0" y="1066.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1066.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">20 results per list; reciprocal-rank fusion combines</tspan><tspan x="115.0" dy="31.05">list positions with k=60; keep at most 40 candidates.</tspan></text><text x="95.0" y="1143.4499999999998" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1143.4499999999998" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Optional relationship expansion: one supported</tspan><tspan x="115.0" dy="31.05">hop, at most 20 entities and 40 evidence</tspan><tspan x="115.0" dy="31.05">references; indicate truncation.</tspan></text><text x="95.0" y="1251.6" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1251.6" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">4,096 evidence tokens using the actual tokenizer;</tspan><tspan x="115.0" dy="31.05">reserve overhead and output. Enumeration starts at</tspan><tspan x="115.0" dy="31.05">100 records per page.</tspan></text><rect x="700.0" y="967.35" width="600.0" height="418.45000000000005" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="1017.35" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Source fallback is essential</tspan></text><text x="723.0" y="1066.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1066.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Unclassified text and records with empty or pending</tspan><tspan x="743.0" dy="31.05">extraction remain recoverable through permitted</tspan><tspan x="743.0" dy="31.05">source search.</tspan></text><text x="723.0" y="1174.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1174.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Current exclusions govern source search, vectors,</tspan><tspan x="743.0" dy="31.05">relationship expansion, full-history baselines and</tspan><tspan x="743.0" dy="31.05">inspection equally.</tspan></text><text x="723.0" y="1282.65" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1282.65" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Report conflicts and incomplete coverage; preserve</tspan><tspan x="743.0" dy="31.05">original spans supporting personal-history claims.</tspan></text><rect x="1328.0" y="967.35" width="600.0" height="418.45000000000005" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="1017.35" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">What needs comparison</tspan></text><text x="1351.0" y="1066.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1066.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Compare full permitted history, keyword sources,</tspan><tspan x="1371.0" dy="31.05">hybrid sources and hybrid plus typed memories on</tspan><tspan x="1371.0" dy="31.05">identical questions.</tspan></text><text x="1351.0" y="1174.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1174.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Local multilingual E5-small embeddings remain</tspan><tspan x="1371.0" dy="31.05">unproven here; test Hindi/Hinglish, names and</tspan><tspan x="1371.0" dy="31.05">negation.</tspan></text><text x="1351.0" y="1282.65" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1282.65" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Exact vector scoring avoids approximate-index</tspan><tspan x="1371.0" dy="31.05">losses; it does not guarantee semantic relevance,</tspan><tspan x="1371.0" dy="31.05">complete evidence or correct answers.</tspan></text><rect x="72" y="1413.8000000000002" width="1856" height="144.8" rx="14" fill="#e1eff4" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1449.8000000000002" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">TERMS IN THIS IMAGE</tspan></text><text x="96" y="1486.8000000000002" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Keyword search matches words; vector search compares encoded meaning. Fusion combines ranked result lists. Tokens are the model’s text units. A freshness token</tspan><tspan x="96" dy="32.400000000000006">records the knowledge versions used so publication can detect changes.</tspan></text><rect x="72" y="1578.6000000000001" width="1856" height="112.4" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1614.6000000000001" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">ILLUSTRATIVE EXAMPLE</tspan></text><text x="96" y="1651.6000000000001" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">“What changed about Jaipur?” needs old and new budgets plus evidence connecting them to the same trip. A similar hotel preference cannot prove the change.</tspan></text><rect x="72" y="1711.0000000000002" width="1856" height="144.8" rx="14" fill="#fff0cf" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1747.0000000000002" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">REMAINING WORK / DECISION</tspan></text><text x="96" y="1784.0000000000002" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Unbuilt: keyword retrieval, evidence bundles, enumeration and freshness checks. Build source search first; justify vectors and relationship expansion through measured</tspan><tspan x="96" dy="32.400000000000006">gains.</tspan></text><text x="72" y="1901.8000000000002" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700"><tspan x="72" dy="0">MENTOR DISCUSSION Which questions require exhaustive evidence, and what measured gain would justify vectors or relationship traversal?</tspan></text><path d="M 72,1937.2000000000003 L 1928,1937.2000000000003" fill="none" stroke="#ccd9cf" stroke-width="2.5" stroke-linejoin="round"   /><text x="72" y="1970.2000000000003" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="72" dy="0">Source: ARCHITECTURE.md §§5, 9–10; guide 04 | Canonical plan revision 1.1 | 6 September 2026</tspan></text></svg>