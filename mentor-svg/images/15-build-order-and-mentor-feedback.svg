<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1918" viewBox="0 0 2000 1918" role="img" aria-labelledby="title desc"><title id="title">From reviewed plan to a complete product</title><desc id="desc">Preserve the core truth and control guarantees while building the smallest complete path. Planning coverage is not a measure of implemented product completion. The next recommended deliverable is a small behavior specification and acceptance cases. Build source persistence and a cited-answer path next, with evaluation fixtures alongside implementation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfa"/><text x="72" y="53" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">GOLDEN GOOSE / MENTOR REVIEW / 15</tspan></text><text x="72" y="119" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700"><tspan x="72" dy="0">From reviewed plan to a complete product</tspan></text><text x="72" y="164" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="72" dy="0">Use mentor feedback to narrow the first useful journey and turn each milestone into observable evidence.</tspan></text><rect x="72" y="190.4" width="1856" height="46" rx="7" fill="#fff0cf" stroke="#fff0cf" stroke-width="1.5"/><text x="88" y="216.4" fill="#73501b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="88" dy="0">STATUS: REVIEWED PLAN • APPLICATION IMPLEMENTATION PENDING • TARGETS ARE NOT MEASURED RESULTS</tspan></text><text x="72" y="284.4" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="72" dy="0">Preserve the core truth and control guarantees while building the smallest complete path. Planning coverage is not a measure of implemented product completion.</tspan></text><text x="72" y="338.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">PROCESS / READ THE NUMBERED STEPS</tspan></text><rect x="72.0" y="358.15" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96.0" dy="0">01</tspan></text><text x="96.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Specify the first journey</tspan></text><text x="96.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96.0" dy="0">Select one recurring task and its normal,</tspan><tspan x="96.0" dy="32.400000000000006">ambiguous, changed, forgotten and failed states.</tspan><tspan x="96.0" dy="32.400000000000006">Account for independently authored Part One.</tspan></text><rect x="700.0" y="358.15" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="724.0" dy="0">02</tspan></text><text x="724.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Persist and inspect sources</tspan></text><text x="724.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="724.0" dy="0">Build import, migrations, source identity, permitted</tspan><tspan x="724.0" dy="32.400000000000006">projections, inspection and keyword search. Prove</tspan><tspan x="724.0" dy="32.400000000000006">restart/reimport and relevant scope/exclusion rules.</tspan></text><rect x="1328.0" y="358.15" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1352.0" dy="0">03</tspan></text><text x="1352.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Complete one answer path</tspan></text><text x="1352.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1352.0" dy="0">Connect the model/coordinator to persisted sources.</tspan><tspan x="1352.0" dy="32.400000000000006">Add citations, honest unknowns, explicit controls</tspan><tspan x="1352.0" dy="32.400000000000006">and measured calls/latency.</tspan></text><rect x="1328.0" y="676.75" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="716.75" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1352.0" dy="0">04</tspan></text><text x="1352.0" y="757.75" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Add measured memory</tspan></text><text x="1352.0" y="799.75" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1352.0" dy="0">Implement selective extraction, temporal/entity</tspan><tspan x="1352.0" dy="32.400000000000006">handling and source fallback. Test optional</tspan><tspan x="1352.0" dy="32.400000000000006">embeddings and relationship expansion against</tspan><tspan x="1352.0" dy="32.400000000000006">simpler baselines.</tspan></text><rect x="700.0" y="676.75" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="716.75" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="724.0" dy="0">05</tspan></text><text x="724.0" y="757.75" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Finish the experience</tspan></text><text x="724.0" y="799.75" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="724.0" dy="0">Connect the normal-user interface and one justified</tspan><tspan x="724.0" dy="32.400000000000006">artifact tool to the same core. Exercise evidence,</tspan><tspan x="724.0" dy="32.400000000000006">control and failure states.</tspan></text><rect x="72.0" y="676.75" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="716.75" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96.0" dy="0">06</tspan></text><text x="96.0" y="757.75" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Evaluate and rehearse</tspan></text><text x="96.0" y="799.75" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96.0" dy="0">Freeze the pipeline, run sealed comparisons, report</tspan><tspan x="96.0" dy="32.400000000000006">failures and costs, and complete the clean-checkout</tspan><tspan x="96.0" dy="32.400000000000006">reviewer procedure.</tspan></text><path d="M 672.0,486.45 L 700.0,486.45" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1300.0,486.45 L 1328.0,486.45" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1628.0,614.75 L 1628.0,676.75" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1328.0,805.05 L 1300.0,805.05" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 700.0,805.05 L 672.0,805.05" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><rect x="72.0" y="967.35" width="600.0" height="464.5" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="1017.35" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">What exists now</tspan></text><text x="95.0" y="1066.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1066.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Canonical architecture, research dossier, process</tspan><tspan x="115.0" dy="31.05">guide and these explanatory diagrams.</tspan></text><text x="95.0" y="1143.4499999999998" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1143.4499999999998" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">An executable research-only SQLite contract</tspan><tspan x="115.0" dy="31.05">experiment with 12/12 checks recorded as passing.</tspan></text><text x="95.0" y="1220.5499999999997" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1220.5499999999997" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">The probe does not validate real concurrency, disk</tspan><tspan x="115.0" dy="31.05">recovery, model meaning, graph cleanup, external</tspan><tspan x="115.0" dy="31.05">tools or speed.</tspan></text><rect x="700.0" y="967.35" width="600.0" height="464.5" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="1017.35" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">What remains open</tspan></text><text x="723.0" y="1066.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1066.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">First recurring journey; final UI/API framework;</tspan><tspan x="743.0" dy="31.05">admission, sensitive-data and retention experience.</tspan></text><text x="723.0" y="1143.4499999999998" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1143.4499999999998" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Exact DeepSeek endpoint/output behavior;</tspan><tspan x="743.0" dy="31.05">embedding default; multilingual accuracy, cost and</tspan><tspan x="743.0" dy="31.05">latency.</tspan></text><text x="723.0" y="1251.6" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1251.6" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Actual application, CLI, schema/migrations, corpus,</tspan><tspan x="743.0" dy="31.05">live model integration and product evaluation are</tspan><tspan x="743.0" dy="31.05">unbuilt.</tspan></text><text x="723.0" y="1359.75" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1359.75" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Quality thresholds and performance targets are</tspan><tspan x="743.0" dy="31.05">proposals to test, not achieved promises.</tspan></text><rect x="1328.0" y="967.35" width="600.0" height="464.5" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="1017.35" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Decisions to discuss with a mentor</tspan></text><text x="1351.0" y="1066.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1066.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Is the chosen task useful enough, and is its memory</tspan><tspan x="1371.0" dy="31.05">scope defensible?</tspan></text><text x="1351.0" y="1143.4499999999998" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1143.4499999999998" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Are evidence, changes, ambiguity and forgetting</tspan><tspan x="1371.0" dy="31.05">understandable to the user?</tspan></text><text x="1351.0" y="1220.5499999999997" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1220.5499999999997" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Which baseline proves benefit, and what failure</tspan><tspan x="1371.0" dy="31.05">would change the design?</tspan></text><text x="1351.0" y="1297.6499999999996" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1297.6499999999996" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">What should be cut? Defer graph servers, Redis,</tspan><tspan x="1371.0" dy="31.05">answer caches, autonomous reflection and broad</tspan><tspan x="1371.0" dy="31.05">integrations until justified.</tspan></text><rect x="72" y="1459.85" width="1856" height="144.8" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1495.85" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">ILLUSTRATIVE EXAMPLE</tspan></text><text x="96" y="1532.85" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">First engineering success: a small reviewed history survives restart; a real query returns a cited answer; a correction changes the next answer; forgetting blocks the same</tspan><tspan x="96" dy="32.400000000000006">information through source search and replay.</tspan></text><rect x="72" y="1624.6499999999999" width="1856" height="144.8" rx="14" fill="#fff0cf" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1660.6499999999999" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">REMAINING WORK / DECISION</tspan></text><text x="96" y="1697.6499999999999" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">The next recommended deliverable is a small behavior specification and acceptance cases. Build source persistence and a cited-answer path next, with evaluation fixtures</tspan><tspan x="96" dy="32.400000000000006">alongside implementation.</tspan></text><text x="72" y="1815.4499999999998" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700"><tspan x="72" dy="0">MENTOR DISCUSSION Which three observations would tell us this first end-to-end slice is ready to expand?</tspan></text><path d="M 72,1850.85 L 1928,1850.85" fill="none" stroke="#ccd9cf" stroke-width="2.5" stroke-linejoin="round"   /><text x="72" y="1883.85" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="72" dy="0">Source: Architecture §§14–16; brief pp.3–7 | Canonical plan revision 1.1 | 6 September 2026</tspan></text></svg>