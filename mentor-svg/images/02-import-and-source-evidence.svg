<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1800" viewBox="0 0 2000 1800" role="img" aria-labelledby="title desc"><title id="title">Import history without losing its meaning</title><desc id="desc">Accept paired transcript records from development data or a reviewer&#x27;s corpus. Preserve original evidence, missing metadata and source identity before deriving memories. Freeze and implement the import schema, migrations, source inspection, keyword indexing, durable jobs and reset behavior. Create a small reviewed fixture before expanding to the full corpus.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfa"/><text x="72" y="53" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">GOLDEN GOOSE / MENTOR REVIEW / 02</tspan></text><text x="72" y="119" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700"><tspan x="72" dy="0">Import history without losing its meaning</tspan></text><text x="72" y="164" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="72" dy="0">The durable source ledger is the starting evidence for both search and learning.</tspan></text><rect x="72" y="190.4" width="1856" height="46" rx="7" fill="#fff0cf" stroke="#fff0cf" stroke-width="1.5"/><text x="88" y="216.4" fill="#73501b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="88" dy="0">STATUS: REVIEWED PLAN • APPLICATION IMPLEMENTATION PENDING • TARGETS ARE NOT MEASURED RESULTS</tspan></text><text x="72" y="284.4" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="72" dy="0">Accept paired transcript records from development data or a reviewer&#x27;s corpus. Preserve original evidence, missing metadata and source identity before deriving</tspan><tspan x="72" dy="33.75">memories.</tspan></text><text x="72" y="371.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">PROCESS / READ THE NUMBERED STEPS</tspan></text><rect x="72.0" y="391.9" width="443.0" height="289.0" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="431.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96.0" dy="0">01</tspan></text><text x="96.0" y="472.9" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Validate the envelope</tspan></text><text x="96.0" y="514.9" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96.0" dy="0">Read raw ASR, formatted text,</tspan><tspan x="96.0" dy="32.400000000000006">source identity and available</tspan><tspan x="96.0" dy="32.400000000000006">metadata. Keep optional times, app</tspan><tspan x="96.0" dy="32.400000000000006">and project fields missing when</tspan><tspan x="96.0" dy="32.400000000000006">unknown.</tspan></text><rect x="543.0" y="391.9" width="443.0" height="289.0" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="567.0" y="431.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="567.0" dy="0">02</tspan></text><text x="567.0" y="472.9" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="567.0" dy="0">Resolve import identity</tspan></text><text x="567.0" y="514.9" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="567.0" dy="0">Use stable record ID, revision and</tspan><tspan x="567.0" dy="32.400000000000006">payload. Repeating an import must</tspan><tspan x="567.0" dy="32.400000000000006">not duplicate an event; identical text</tspan><tspan x="567.0" dy="32.400000000000006">can still describe distinct events.</tspan></text><rect x="1014.0" y="391.9" width="443.0" height="289.0" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1038.0" y="431.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1038.0" dy="0">03</tspan></text><text x="1038.0" y="472.9" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1038.0" dy="0">Commit source and jobs</tspan></text><text x="1038.0" y="514.9" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1038.0" dy="0">Persist the original revision and head,</tspan><tspan x="1038.0" dy="32.400000000000006">permitted visibility and required</tspan><tspan x="1038.0" dy="32.400000000000006">durable work in one transaction.</tspan><tspan x="1038.0" dy="32.400000000000006">Record each row&#x27;s outcome.</tspan></text><rect x="1485.0" y="391.9" width="443.0" height="289.0" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1509.0" y="431.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1509.0" dy="0">04</tspan></text><text x="1509.0" y="472.9" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1509.0" dy="0">Expose permitted search</tspan></text><text x="1509.0" y="514.9" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1509.0" dy="0">Make allowed source text searchable</tspan><tspan x="1509.0" dy="32.400000000000006">independently of extraction. Queue</tspan><tspan x="1509.0" dy="32.400000000000006">learning and optional encoding with</tspan><tspan x="1509.0" dy="32.400000000000006">visible stage readiness and failures.</tspan></text><path d="M 515.0,536.4 L 543.0,536.4" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 986.0,536.4 L 1014.0,536.4" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1457.0,536.4 L 1485.0,536.4" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><rect x="72.0" y="714.9" width="600.0" height="433.45" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="764.9" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Proposed import contract</tspan></text><text x="95.0" y="813.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="813.9" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">schema_version; record_id and revision; exact</tspan><tspan x="115.0" dy="31.05">raw_asr and formatted_text.</tspan></text><text x="95.0" y="891.0" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="891.0" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Optional captured_at, timezone and available_at</tspan><tspan x="115.0" dy="31.05">preserve distinct meanings.</tspan></text><text x="95.0" y="968.1" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="968.1" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Optional app, conversation_id, project_id and</tspan><tspan x="115.0" dy="31.05">original metadata; app name is not project identity.</tspan></text><text x="95.0" y="1045.2" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1045.2" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Trusted user scope comes from the</tspan><tspan x="115.0" dy="31.05">application/import command, not from the model or</tspan><tspan x="115.0" dy="31.05">an arbitrary row.</tspan></text><rect x="700.0" y="714.9" width="600.0" height="433.45" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="764.9" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Evidence rules</tspan></text><text x="723.0" y="813.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="813.9" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Raw and formatted text are paired versions of one</tspan><tspan x="743.0" dy="31.05">observation, not independent corroboration.</tspan></text><text x="723.0" y="891.0" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="891.0" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Preserve material disagreement; fluent formatting</tspan><tspan x="743.0" dy="31.05">does not establish factual truth.</tspan></text><text x="723.0" y="968.1" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="968.1" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Evidence spans use original field/revision and</tspan><tspan x="743.0" dy="31.05">zero-based Unicode character positions, with end</tspan><tspan x="743.0" dy="31.05">excluded.</tspan></text><text x="723.0" y="1076.25" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1076.25" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Normalization, transliteration or chunking needs a</tspan><tspan x="743.0" dy="31.05">mapping back to original spans.</tspan></text><rect x="1328.0" y="714.9" width="600.0" height="433.45" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="764.9" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Integrity and reviewer use</tspan></text><text x="1351.0" y="813.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="813.9" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Account for every row: accepted, duplicate, pending</tspan><tspan x="1371.0" dy="31.05">or rejected, with a reason.</tspan></text><text x="1351.0" y="891.0" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="891.0" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Restart/resume must retain progress. An empty</tspan><tspan x="1371.0" dy="31.05">extraction is different from a processing failure.</tspan></text><text x="1351.0" y="968.1" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="968.1" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Reimport cannot silently recreate excluded or</tspan><tspan x="1371.0" dy="31.05">deleted knowledge; define explicit restoration</tspan><tspan x="1371.0" dy="31.05">separately.</tspan></text><text x="1351.0" y="1076.25" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1076.25" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Document import, process, inspect, query and reset</tspan><tspan x="1371.0" dy="31.05">for another approximately 500-record corpus.</tspan></text><rect x="72" y="1176.35" width="1856" height="144.8" rx="14" fill="#e1eff4" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1212.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">TERMS IN THIS IMAGE</tspan></text><text x="96" y="1249.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Revision = a specific saved version. Head = the selected current revision. Permitted projection = only the source text still eligible for use. A span identifies an exact passage</tspan><tspan x="96" dy="32.400000000000006">in the original text.</tspan></text><rect x="72" y="1341.1499999999999" width="1856" height="144.8" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1377.1499999999999" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">ILLUSTRATIVE EXAMPLE</tspan></text><text x="96" y="1414.1499999999999" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">An old transcript imported today can describe last month&#x27;s budget. Its arrival time must not make that old value overwrite a supported newer budget. Missing source dates</tspan><tspan x="96" dy="32.400000000000006">remain unknown.</tspan></text><rect x="72" y="1505.9499999999998" width="1856" height="144.8" rx="14" fill="#fff0cf" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1541.9499999999998" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">REMAINING WORK / DECISION</tspan></text><text x="96" y="1578.9499999999998" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Freeze and implement the import schema, migrations, source inspection, keyword indexing, durable jobs and reset behavior. Create a small reviewed fixture before</tspan><tspan x="96" dy="32.400000000000006">expanding to the full corpus.</tspan></text><text x="72" y="1696.7499999999998" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700"><tspan x="72" dy="0">MENTOR DISCUSSION Can a reviewer import ordinary logs without inventing metadata or repairing undocumented setup?</tspan></text><path d="M 72,1732.1499999999999 L 1928,1732.1499999999999" fill="none" stroke="#ccd9cf" stroke-width="2.5" stroke-linejoin="round"   /><text x="72" y="1765.1499999999999" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="72" dy="0">Source: Brief pp.4–7; architecture §§4–5, 7, 11.1 | Canonical plan revision 1.1 | 6 September 2026</tspan></text></svg>