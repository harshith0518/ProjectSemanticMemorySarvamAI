<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2114" viewBox="0 0 2000 2114" role="img" aria-labelledby="title desc"><title id="title">Durable state, background work and safe recovery</title><desc id="desc">Preserve knowledge and controls across retries, restarts, stale work and partial failures. Only an isolated SQLite probe passed 12 checks. Product migrations, real concurrency, disk recovery, model semantics, graph/alias cleanup, tool integration and performance still need implementation tests.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfa"/><text x="72" y="53" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">GOLDEN GOOSE / MENTOR REVIEW / 11</tspan></text><text x="72" y="119" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700"><tspan x="72" dy="0">Durable state, background work and safe recovery</tspan></text><text x="72" y="164" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="72" dy="0">Designed; product unbuilt · One Python process, local SQLite database and worker.</tspan></text><rect x="72" y="190.4" width="1856" height="46" rx="7" fill="#fff0cf" stroke="#fff0cf" stroke-width="1.5"/><text x="88" y="216.4" fill="#73501b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="88" dy="0">STATUS: REVIEWED PLAN • APPLICATION IMPLEMENTATION PENDING • TARGETS ARE NOT MEASURED RESULTS</tspan></text><text x="72" y="284.4" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="72" dy="0">Preserve knowledge and controls across retries, restarts, stale work and partial failures.</tspan></text><text x="72" y="338.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">PROCESS / READ THE NUMBERED STEPS</tspan></text><rect x="72.0" y="358.15" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96.0" dy="0">01</tspan></text><text x="96.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Persist identity</tspan></text><text x="96.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96.0" dy="0">Same request/import key plus same canonical</tspan><tspan x="96.0" dy="32.400000000000006">payload returns its receipt; the same key with</tspan><tspan x="96.0" dy="32.400000000000006">changed payload conflicts.</tspan></text><rect x="700.0" y="358.15" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="724.0" dy="0">02</tspan></text><text x="724.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Commit related changes</tspan></text><text x="724.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="724.0" dy="0">Controls, admission and response acceptance use</tspan><tspan x="724.0" dy="32.400000000000006">short transactions. Enqueue required jobs</tspan><tspan x="724.0" dy="32.400000000000006">atomically; compute embeddings, call models and</tspan><tspan x="724.0" dy="32.400000000000006">execute tools outside transactions.</tspan></text><rect x="1328.0" y="358.15" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1352.0" dy="0">03</tspan></text><text x="1352.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Reject stale work</tspan></text><text x="1352.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1352.0" dy="0">Attempt tokens fence reclaimed workers. Recheck</tspan><tspan x="1352.0" dy="32.400000000000006">permitted text, knowledge/source revisions, target</tspan><tspan x="1352.0" dy="32.400000000000006">state and configuration; discard or requeue outdated</tspan><tspan x="1352.0" dy="32.400000000000006">results.</tspan></text><rect x="1328.0" y="676.75" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="716.75" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1352.0" dy="0">04</tspan></text><text x="1352.0" y="757.75" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Recover interruption</tspan></text><text x="1352.0" y="799.75" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1352.0" dy="0">Replay committed database receipts. Preserve</tspan><tspan x="1352.0" dy="32.400000000000006">unknown dispatched effects and reconcile before</tspan><tspan x="1352.0" dy="32.400000000000006">further execution; retries are not exactly-once</tspan><tspan x="1352.0" dy="32.400000000000006">effects.</tspan></text><rect x="700.0" y="676.75" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="716.75" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="724.0" dy="0">05</tspan></text><text x="724.0" y="757.75" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Resume explicitly</tspan></text><text x="724.0" y="799.75" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="724.0" dy="0">Failed-run resume creates a linked attempt with</tspan><tspan x="724.0" dy="32.400000000000006">fresh bounded budget; retain terminal history,</tspan><tspan x="724.0" dy="32.400000000000006">committed receipts and cumulative usage.</tspan></text><rect x="72.0" y="676.75" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="716.75" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96.0" dy="0">06</tspan></text><text x="96.0" y="757.75" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Rebuild acceleration</tspan></text><text x="96.0" y="799.75" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96.0" dy="0">Rebuild indexes and optional RAM views from</tspan><tspan x="96.0" dy="32.400000000000006">permitted durable state. Implement migrations, safe</tspan><tspan x="96.0" dy="32.400000000000006">backup and clean-checkout recovery.</tspan></text><path d="M 672.0,486.45 L 700.0,486.45" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1300.0,486.45 L 1328.0,486.45" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1628.0,614.75 L 1628.0,676.75" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1328.0,805.05 L 1300.0,805.05" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 700.0,805.05 L 672.0,805.05" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><rect x="72.0" y="967.35" width="600.0" height="495.55" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="1017.35" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Three lifecycles</tspan></text><text x="95.0" y="1066.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1066.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Run: accepted → running ↔ waiting input →</tspan><tspan x="115.0" dy="31.05">completed, partial, failed, cancelled or outcome</tspan><tspan x="115.0" dy="31.05">unknown.</tspan></text><text x="95.0" y="1174.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1174.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Learning: held → queued → running → succeeded,</tspan><tspan x="115.0" dy="31.05">no-op or excluded; bounded retries may fail.</tspan></text><text x="95.0" y="1251.6" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1251.6" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Effect: proposed → ready/waiting approval →</tspan><tspan x="115.0" dy="31.05">dispatched → succeeded, failed or unknown;</tspan><tspan x="115.0" dy="31.05">unknown requires reconciliation.</tspan></text><text x="95.0" y="1359.75" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1359.75" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Post-dispatch cancellation cannot guarantee</tspan><tspan x="115.0" dy="31.05">rollback; waiting-input continuation retains its</tspan><tspan x="115.0" dy="31.05">existing attempt budget.</tspan></text><rect x="700.0" y="967.35" width="600.0" height="495.55" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="1017.35" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Authority and freshness</tspan></text><text x="723.0" y="1066.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1066.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Trusted user scope, parameterized SQL, current</tspan><tspan x="743.0" dy="31.05">heads and foreign keys protect revision boundaries.</tspan></text><text x="723.0" y="1143.4499999999998" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1143.4499999999998" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Knowledge revision tracks evidence/controls; index</tspan><tspan x="743.0" dy="31.05">revision tracks representations; publication</tspan><tspan x="743.0" dy="31.05">sequence orders controls and responses.</tspan></text><text x="723.0" y="1251.6" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1251.6" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Memory interpretations and controls are durable;</tspan><tspan x="743.0" dy="31.05">supported links and search indexes are rebuildable.</tspan></text><rect x="1328.0" y="967.35" width="600.0" height="495.55" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="1017.35" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Reuse with explicit validity</tspan></text><text x="1351.0" y="1066.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1066.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Persist vectors by user, revision, permitted-text</tspan><tspan x="1371.0" dy="31.05">digest and encoder configuration; retain the loaded</tspan><tspan x="1371.0" dy="31.05">encoder.</tspan></text><text x="1351.0" y="1174.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1174.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Optional RAM views require revision checks.</tspan><tspan x="1371.0" dy="31.05">Query, retrieval-result and final-answer caches start</tspan><tspan x="1371.0" dy="31.05">disabled.</tspan></text><text x="1351.0" y="1282.65" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1282.65" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Time-to-live cannot guarantee immediate forgetting;</tspan><tspan x="1371.0" dy="31.05">every read must check eligibility.</tspan></text><rect x="72" y="1490.9" width="1856" height="144.8" rx="14" fill="#e1eff4" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1526.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">TERMS IN THIS IMAGE</tspan></text><text x="96" y="1563.9" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Idempotency = repeating the same identified operation does not duplicate its database change. A fencing token rejects an outdated worker attempt. A digest fingerprints</tspan><tspan x="96" dy="32.400000000000006">content. Reconciliation checks what actually happened after an uncertain external effect.</tspan></text><rect x="72" y="1655.7" width="1856" height="144.8" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1691.7" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">ILLUSTRATIVE EXAMPLE</tspan></text><text x="96" y="1728.7" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">A worker extracts INR 6,000 while a control changes the budget to INR 8,000. The newer knowledge revision rejects stale admission. Restart preserves the committed</tspan><tspan x="96" dy="32.400000000000006">change and job state.</tspan></text><rect x="72" y="1820.5" width="1856" height="144.8" rx="14" fill="#fff0cf" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1856.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">REMAINING WORK / DECISION</tspan></text><text x="96" y="1893.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Only an isolated SQLite probe passed 12 checks. Product migrations, real concurrency, disk recovery, model semantics, graph/alias cleanup, tool integration and</tspan><tspan x="96" dy="32.400000000000006">performance still need implementation tests.</tspan></text><text x="72" y="2011.3" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700"><tspan x="72" dy="0">MENTOR DISCUSSION Which recovery guarantees are essential for the first demonstrable journey, and which optional optimizations can wait?</tspan></text><path d="M 72,2046.7 L 1928,2046.7" fill="none" stroke="#ccd9cf" stroke-width="2.5" stroke-linejoin="round"   /><text x="72" y="2079.7" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="72" dy="0">Source: Architecture §§4, 8, 10–11, 12.3, 14 | Canonical plan revision 1.1 | 6 September 2026</tspan></text></svg>