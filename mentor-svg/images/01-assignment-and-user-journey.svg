<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1632" viewBox="0 0 2000 1632" role="img" aria-labelledby="title desc"><title id="title">The assignment and the user experience</title><desc id="desc">Help a person recover useful work history and apply it to a present request, with evidence and effortless control. The leading recurring task still needs to be selected. Select the first recurring task, confirm the applicant&#x27;s Part One status, and specify normal, ambiguous, corrected, forgotten and failed outcomes. The working interface/backend are not built.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfa"/><text x="72" y="53" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">GOLDEN GOOSE / MENTOR REVIEW / 01</tspan></text><text x="72" y="119" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700"><tspan x="72" dy="0">The assignment and the user experience</tspan></text><text x="72" y="164" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="72" dy="0">What problem the product must solve, what the demonstration must prove, and which boundaries matter.</tspan></text><rect x="72" y="190.4" width="1856" height="46" rx="7" fill="#fff0cf" stroke="#fff0cf" stroke-width="1.5"/><text x="88" y="216.4" fill="#73501b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="88" dy="0">STATUS: REVIEWED PLAN • APPLICATION IMPLEMENTATION PENDING • TARGETS ARE NOT MEASURED RESULTS</tspan></text><text x="72" y="284.4" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="72" dy="0">Help a person recover useful work history and apply it to a present request, with evidence and effortless control. The leading recurring task still needs to be selected.</tspan></text><text x="72" y="338.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">PROCESS / READ THE NUMBERED STEPS</tspan></text><rect x="72.0" y="358.15" width="443.0" height="289.0" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96.0" dy="0">01</tspan></text><text x="96.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Choose a useful task</tspan></text><text x="96.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96.0" dy="0">Start from a recurring user need.</tspan><tspan x="96.0" dy="32.400000000000006">Select the few capabilities that create</tspan><tspan x="96.0" dy="32.400000000000006">meaningful value; memory capacity</tspan><tspan x="96.0" dy="32.400000000000006">alone is not a product.</tspan></text><rect x="543.0" y="358.15" width="443.0" height="289.0" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="567.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="567.0" dy="0">02</tspan></text><text x="567.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="567.0" dy="0">Ground it in history</tspan></text><text x="567.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="567.0" dy="0">Use real persisted transcripts and</tspan><tspan x="567.0" dy="32.400000000000006">model decisions. Recover relevant</tspan><tspan x="567.0" dy="32.400000000000006">facts, preferences and episodes,</tspan><tspan x="567.0" dy="32.400000000000006">including information distributed</tspan><tspan x="567.0" dy="32.400000000000006">across records.</tspan></text><rect x="1014.0" y="358.15" width="443.0" height="289.0" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1038.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1038.0" dy="0">03</tspan></text><text x="1038.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1038.0" dy="0">Show changed behavior</tspan></text><text x="1038.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1038.0" dy="0">A later answer or draft should use</tspan><tspan x="1038.0" dy="32.400000000000006">supported context. Make uncertainty,</tspan><tspan x="1038.0" dy="32.400000000000006">corrections and forgetting</tspan><tspan x="1038.0" dy="32.400000000000006">understandable in ordinary use.</tspan></text><rect x="1485.0" y="358.15" width="443.0" height="289.0" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1509.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1509.0" dy="0">04</tspan></text><text x="1509.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1509.0" dy="0">Prove the experience</tspan></text><text x="1509.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1509.0" dy="0">Demonstrate the real interface and</tspan><tspan x="1509.0" dy="32.400000000000006">backend, then evaluate the complete</tspan><tspan x="1509.0" dy="32.400000000000006">pipeline and let a reviewer import</tspan><tspan x="1509.0" dy="32.400000000000006">unfamiliar history.</tspan></text><path d="M 515.0,502.65 L 543.0,502.65" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 986.0,502.65 L 1014.0,502.65" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1457.0,502.65 L 1485.0,502.65" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><rect x="72.0" y="681.15" width="600.0" height="464.5" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="731.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Two coherent modes</tspan></text><text x="95.0" y="780.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="780.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Regular dictation preserves intended content;</tspan><tspan x="115.0" dy="31.05">vocabulary and writing style are separate concerns.</tspan></text><text x="95.0" y="857.25" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="857.25" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Hey Kivi uses relevant history for interactive help.</tspan><tspan x="115.0" dy="31.05">Memory does not authorize unsolicited content</tspan><tspan x="115.0" dy="31.05">insertion.</tspan></text><text x="95.0" y="965.4" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="965.4" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Transcript replay and typed requests are</tspan><tspan x="115.0" dy="31.05">acceptable. Speech recognition and production Kivi</tspan><tspan x="115.0" dy="31.05">integration are not required.</tspan></text><rect x="700.0" y="681.15" width="600.0" height="464.5" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="731.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Independent product work</tspan></text><text x="723.0" y="780.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="780.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">First use Kivi and study other products: how</tspan><tspan x="743.0" dy="31.05">memory, personalization and user control relate.</tspan></text><text x="723.0" y="857.25" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="857.25" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Part One: applicant forms and writes a position of at</tspan><tspan x="743.0" dy="31.05">most 100 words and a vision of at most 600 words.</tspan></text><text x="723.0" y="934.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="934.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">The brief excludes generative AI from arriving at or</tspan><tspan x="743.0" dy="31.05">writing Part One. Preserve both documents before</tspan><tspan x="743.0" dy="31.05">Part Two.</tspan></text><text x="723.0" y="1042.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1042.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">This technical SVG pack is AI-assisted planning</tspan><tspan x="743.0" dy="31.05">material. It is not the applicant&#x27;s Part One</tspan><tspan x="743.0" dy="31.05">submission.</tspan></text><rect x="1328.0" y="681.15" width="600.0" height="464.5" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="731.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">A complete demonstration</tspan></text><text x="1351.0" y="780.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="780.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">A normal-user interface must begin and end the</tspan><tspan x="1371.0" dy="31.05">experience; a CLI is only an intermediate build</tspan><tspan x="1371.0" dy="31.05">milestone.</tspan></text><text x="1351.0" y="888.3" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="888.3" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Narrow tools are acceptable; history questions</tspan><tspan x="1371.0" dy="31.05">cannot be restricted to a memorized demonstration</tspan><tspan x="1371.0" dy="31.05">script.</tspan></text><text x="1351.0" y="996.4499999999999" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="996.4499999999999" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Supported recall, useful context, uncertainty, control</tspan><tspan x="1371.0" dy="31.05">and inspectable sources must work together.</tspan></text><rect x="72" y="1173.65" width="1856" height="144.8" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1209.65" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">ILLUSTRATIVE EXAMPLE</tspan></text><text x="96" y="1246.65" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Illustrative journey, not the final product choice: recall the Jaipur budget → draft a checklist → change the budget → inspect its source → forget it → verify the next answer</tspan><tspan x="96" dy="32.400000000000006">respects that change.</tspan></text><rect x="72" y="1338.45" width="1856" height="144.8" rx="14" fill="#fff0cf" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1374.45" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">REMAINING WORK / DECISION</tspan></text><text x="96" y="1411.45" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Select the first recurring task, confirm the applicant&#x27;s Part One status, and specify normal, ambiguous, corrected, forgotten and failed outcomes. The working</tspan><tspan x="96" dy="32.400000000000006">interface/backend are not built.</tspan></text><text x="72" y="1529.25" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700"><tspan x="72" dy="0">MENTOR DISCUSSION Does the chosen recurring task create enough value to justify what this product remembers?</tspan></text><path d="M 72,1564.65 L 1928,1564.65" fill="none" stroke="#ccd9cf" stroke-width="2.5" stroke-linejoin="round"   /><text x="72" y="1597.65" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="72" dy="0">Source: Golden Goose brief pp.2–6; architecture §§0, 15–16 | Canonical plan revision 1.1 | 6 September 2026</tspan></text></svg>