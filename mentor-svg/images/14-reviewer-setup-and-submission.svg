<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2014" viewBox="0 0 2000 2014" role="img" aria-labelledby="title desc"><title id="title">Make the complete product reproducible</title><desc id="desc">Eliminate undocumented setup and demonstration-only behavior. The proposed primary arrangement is a local application/database connected to a hosted model API. Implement the product and document commands only after testing them. RUN.md, actual migrations, seed data, corpus and evaluation results are still required deliverables.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfa"/><text x="72" y="53" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">GOLDEN GOOSE / MENTOR REVIEW / 14</tspan></text><text x="72" y="119" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700"><tspan x="72" dy="0">Make the complete product reproducible</tspan></text><text x="72" y="164" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="72" dy="0">A reviewing agent will clone the final commit, follow RUN.md, import new history and evaluate the actual system.</tspan></text><rect x="72" y="190.4" width="1856" height="46" rx="7" fill="#fff0cf" stroke="#fff0cf" stroke-width="1.5"/><text x="88" y="216.4" fill="#73501b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="88" dy="0">STATUS: REVIEWED PLAN • APPLICATION IMPLEMENTATION PENDING • TARGETS ARE NOT MEASURED RESULTS</tspan></text><text x="72" y="284.4" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="72" dy="0">Eliminate undocumented setup and demonstration-only behavior. The proposed primary arrangement is a local application/database connected to a hosted model</tspan><tspan x="72" dy="33.75">API.</tspan></text><text x="72" y="371.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">PROCESS / READ THE NUMBERED STEPS</tspan></text><rect x="72.0" y="391.9" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="431.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96.0" dy="0">01</tspan></text><text x="96.0" y="472.9" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Install and configure</tspan></text><text x="96.0" y="514.9" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96.0" dy="0">Declare runtimes, versions, dependency commands</tspan><tspan x="96.0" dy="32.400000000000006">and every environment variable. Provide an</tspan><tspan x="96.0" dy="32.400000000000006">environment example with no credentials</tspan><tspan x="96.0" dy="32.400000000000006">committed.</tspan></text><rect x="700.0" y="391.9" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="431.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="724.0" dy="0">02</tspan></text><text x="724.0" y="472.9" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Create and start</tspan></text><text x="724.0" y="514.9" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="724.0" dy="0">Provide exact commands to create, migrate and</tspan><tspan x="724.0" dy="32.400000000000006">seed the database, start required processes, and</tspan><tspan x="724.0" dy="32.400000000000006">open the user interface.</tspan></text><rect x="1328.0" y="391.9" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="431.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1352.0" dy="0">03</tspan></text><text x="1352.0" y="472.9" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Operate and inspect</tspan></text><text x="1352.0" y="514.9" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1352.0" dy="0">Explain primary interactions, memory/source</tspan><tspan x="1352.0" dy="32.400000000000006">inspection and meaningful limitations. The reviewer</tspan><tspan x="1352.0" dy="32.400000000000006">should use the product without repairing setup.</tspan></text><rect x="1328.0" y="710.5" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="750.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1352.0" dy="0">04</tspan></text><text x="1352.0" y="791.5" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Import and evaluate</tspan></text><text x="1352.0" y="833.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1352.0" dy="0">Document another-corpus translation/import,</tspan><tspan x="1352.0" dy="32.400000000000006">processing, history-grounded queries, evaluation</tspan><tspan x="1352.0" dy="32.400000000000006">command and the location of results and memory</tspan><tspan x="1352.0" dy="32.400000000000006">state.</tspan></text><rect x="700.0" y="710.5" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="750.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="724.0" dy="0">05</tspan></text><text x="724.0" y="791.5" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Reset and rehearse</tspan></text><text x="724.0" y="833.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="724.0" dy="0">Document a bounded reset. Test the complete</tspan><tspan x="724.0" dy="32.400000000000006">install/start/import/process/operate/inspect/evaluate/</tspan><tspan x="724.0" dy="32.400000000000006">reset path from the submitted commit.</tspan></text><path d="M 672.0,520.2 L 700.0,520.2" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1300.0,520.2 L 1328.0,520.2" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1628.0,648.5 L 1628.0,710.5" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1328.0,838.8 L 1300.0,838.8" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><rect x="72.0" y="1001.1" width="600.0" height="526.6" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="1051.1" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Repository deliverables</tspan></text><text x="95.0" y="1100.1" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1100.1" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Applicant&#x27;s independently authored position and</tspan><tspan x="115.0" dy="31.05">vision, with the brief&#x27;s required ordering.</tspan></text><text x="95.0" y="1177.1999999999998" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1177.1999999999998" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Complete source code, a working normal-user</tspan><tspan x="115.0" dy="31.05">interface and a real connected backend.</tspan></text><text x="95.0" y="1254.2999999999997" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1254.2999999999997" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Database schema/migrations, reproducible seed</tspan><tspan x="115.0" dy="31.05">data and the approximately 500-record corpus.</tspan></text><text x="95.0" y="1331.3999999999996" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1331.3999999999996" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Runnable evaluation, generated results, visible</tspan><tspan x="115.0" dy="31.05">failures, limitations and inspectable decision traces.</tspan></text><rect x="700.0" y="1001.1" width="600.0" height="526.6" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="1051.1" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">README and RUN.md</tspan></text><text x="723.0" y="1100.1" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1100.1" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">README explains product, architecture, use cases,</tspan><tspan x="743.0" dy="31.05">limitations, results and actual AI use.</tspan></text><text x="723.0" y="1177.1999999999998" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1177.1999999999998" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">RUN.md begins with the primary review method,</tspan><tspan x="743.0" dy="31.05">then lists all setup, database and process</tspan><tspan x="743.0" dy="31.05">commands.</tspan></text><text x="723.0" y="1285.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1285.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Include interface location, interactions, evaluation</tspan><tspan x="743.0" dy="31.05">command, new-corpus procedure, inspection</tspan><tspan x="743.0" dy="31.05">locations and reset instructions.</tspan></text><text x="723.0" y="1393.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1393.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Name credentials precisely, pin required versions,</tspan><tspan x="743.0" dy="31.05">and disclose model-download/startup needs. No</tspan><tspan x="743.0" dy="31.05">private credentials in Git.</tspan></text><rect x="1328.0" y="1001.1" width="600.0" height="526.6" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="1051.1" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Reviewer and submission boundary</tspan></text><text x="1351.0" y="1100.1" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1100.1" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">The reviewer may supply documented credentials</tspan><tspan x="1371.0" dy="31.05">and translate its own roughly 500 dictations into the</tspan><tspan x="1371.0" dy="31.05">declared import format.</tspan></text><text x="1351.0" y="1208.25" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1208.25" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">It will not infer missing steps, perform</tspan><tspan x="1371.0" dy="31.05">undocumented dashboard work, repair the</tspan><tspan x="1371.0" dy="31.05">application or ask for clarification.</tspan></text><text x="1351.0" y="1316.4" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1316.4" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Submit one repository URL and the exact final</tspan><tspan x="1371.0" dy="31.05">commit SHA. Add the application URL when hosted</tspan><tspan x="1371.0" dy="31.05">is the primary method.</tspan></text><text x="1351.0" y="1424.5500000000002" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1424.5500000000002" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Hosting and Docker are optional. A hosted review</tspan><tspan x="1371.0" dy="31.05">path additionally needs a direct URL, access details</tspan><tspan x="1371.0" dy="31.05">and complete operating instructions.</tspan></text><rect x="72" y="1555.7" width="1856" height="144.8" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1591.7" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">ILLUSTRATIVE EXAMPLE</tspan></text><text x="96" y="1628.7" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">A successful rehearsal starts from a clean checkout, creates fresh state, imports an unfamiliar fixture, asks a supported history question, inspects its sources, runs</tspan><tspan x="96" dy="32.400000000000006">evaluation and resets without hidden manual work.</tspan></text><rect x="72" y="1720.5" width="1856" height="144.8" rx="14" fill="#fff0cf" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1756.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">REMAINING WORK / DECISION</tspan></text><text x="96" y="1793.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Implement the product and document commands only after testing them. RUN.md, actual migrations, seed data, corpus and evaluation results are still required</tspan><tspan x="96" dy="32.400000000000006">deliverables.</tspan></text><text x="72" y="1911.3" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700"><tspan x="72" dy="0">MENTOR DISCUSSION Could a new reviewer reproduce the claimed behavior using only this repository and declared credentials?</tspan></text><path d="M 72,1946.7 L 1928,1946.7" fill="none" stroke="#ccd9cf" stroke-width="2.5" stroke-linejoin="round"   /><text x="72" y="1979.7" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="72" dy="0">Source: Golden Goose brief pp.6–7; architecture §§11.1, 15–16 | Canonical plan revision 1.1 | 6 September 2026</tspan></text></svg>