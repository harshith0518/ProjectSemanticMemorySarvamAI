<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1840" viewBox="0 0 2000 1840" role="img" aria-labelledby="title desc"><title id="title">Apply context and handle uncertainty</title><desc id="desc">Improve the present task while respecting current instructions, evidence gaps and the difference between drafting and doing. Unbuilt: response states, sources and task-quality evaluation. Define normal, ambiguous, corrected, forgotten and failed behavior in one journey.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfa"/><text x="72" y="53" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">GOLDEN GOOSE / MENTOR REVIEW / 08</tspan></text><text x="72" y="119" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700"><tspan x="72" dy="0">Apply context and handle uncertainty</tspan></text><text x="72" y="164" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="72" dy="0">Answer, compare or draft using supported history.</tspan></text><rect x="72" y="190.4" width="1856" height="46" rx="7" fill="#fff0cf" stroke="#fff0cf" stroke-width="1.5"/><text x="88" y="216.4" fill="#73501b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="88" dy="0">STATUS: REVIEWED PLAN • APPLICATION IMPLEMENTATION PENDING • TARGETS ARE NOT MEASURED RESULTS</tspan></text><text x="72" y="284.4" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="72" dy="0">Improve the present task while respecting current instructions, evidence gaps and the difference between drafting and doing.</tspan></text><text x="72" y="338.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">PROCESS / READ THE NUMBERED STEPS</tspan></text><rect x="72.0" y="358.15" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96.0" dy="0">01</tspan></text><text x="96.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Start with the present task</tspan></text><text x="96.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96.0" dy="0">Identify the outcome: recover a promise, explain</tspan><tspan x="96.0" dy="32.400000000000006">changes or prepare a draft. Do not insert personal</tspan><tspan x="96.0" dy="32.400000000000006">history into ordinary dictation.</tspan></text><rect x="700.0" y="358.15" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="724.0" dy="0">02</tspan></text><text x="724.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Apply relevant context</tspan></text><text x="724.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="724.0" dy="0">Use supported budgets, preferences and project</tspan><tspan x="724.0" dy="32.400000000000006">details only when helpful. Retrieved facts need not</tspan><tspan x="724.0" dy="32.400000000000006">be mentioned just because they exist.</tspan></text><rect x="1328.0" y="358.15" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1352.0" dy="0">03</tspan></text><text x="1352.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Honor current instructions</tspan></text><text x="1352.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1352.0" dy="0">Today&#x27;s explicit request overrides remembered</tspan><tspan x="1352.0" dy="32.400000000000006">preferences for this run. A one-off override does not</tspan><tspan x="1352.0" dy="32.400000000000006">automatically become permanent.</tspan></text><rect x="1328.0" y="676.75" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="716.75" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1352.0" dy="0">04</tspan></text><text x="1352.0" y="757.75" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Select an honest response</tspan></text><text x="1352.0" y="799.75" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1352.0" dy="0">Enough evidence: answer. Unneeded unknown:</tspan><tspan x="1352.0" dy="32.400000000000006">omit. Material ambiguity: clarify. Missing evidence:</tspan><tspan x="1352.0" dy="32.400000000000006">state the gap and provide supported partial help.</tspan></text><rect x="700.0" y="676.75" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="716.75" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="724.0" dy="0">05</tspan></text><text x="724.0" y="757.75" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Publish an inspectable result</tspan></text><text x="724.0" y="799.75" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="724.0" dy="0">Attach sources, label assumptions and distinguish</tspan><tspan x="724.0" dy="32.400000000000006">drafts from observed outcomes. Recheck</tspan><tspan x="724.0" dy="32.400000000000006">knowledge freshness and authority before accepting</tspan><tspan x="724.0" dy="32.400000000000006">the response.</tspan></text><path d="M 672.0,486.45 L 700.0,486.45" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1300.0,486.45 L 1328.0,486.45" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1628.0,614.75 L 1628.0,676.75" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1328.0,805.05 L 1300.0,805.05" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><rect x="72.0" y="967.35" width="600.0" height="418.45000000000005" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="1017.35" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">When to ask or proceed</tspan></text><text x="95.0" y="1066.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1066.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Ask one focused question when the answer</tspan><tspan x="115.0" dy="31.05">depends on it. Reversible drafts may use explicitly</tspan><tspan x="115.0" dy="31.05">labeled assumptions.</tspan></text><text x="95.0" y="1174.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1174.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Skipped clarification is not confirmation. Preserve</tspan><tspan x="115.0" dy="31.05">uncertainty and use the supported fallback.</tspan></text><text x="95.0" y="1251.6" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1251.6" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Missing recipient, path, time or authority blocks</tspan><tspan x="115.0" dy="31.05">dependent actions; prepare independently</tspan><tspan x="115.0" dy="31.05">supported portions.</tspan></text><rect x="700.0" y="967.35" width="600.0" height="418.45000000000005" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="1017.35" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Boundaries against invention</tspan></text><text x="723.0" y="1066.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1066.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">A visit does not prove enjoyment. Trip changes do</tspan><tspan x="743.0" dy="31.05">not automatically reschedule meetings.</tspan></text><text x="723.0" y="1143.4499999999998" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1143.4499999999998" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">A file location does not establish contents or</tspan><tspan x="743.0" dy="31.05">access. Remembered constraints do not establish</tspan><tspan x="743.0" dy="31.05">live availability or a completed booking.</tspan></text><text x="723.0" y="1251.6" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1251.6" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Historical instructions grant no current authority.</tspan><tspan x="743.0" dy="31.05">Actual operation receipts establish successful</tspan><tspan x="743.0" dy="31.05">effects.</tspan></text><rect x="1328.0" y="967.35" width="600.0" height="418.45000000000005" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="1017.35" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Evaluate usefulness and restraint</tspan></text><text x="1351.0" y="1066.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1066.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Measure supported task success, useful adaptation</tspan><tspan x="1371.0" dy="31.05">and unwanted personal callbacks; mentioning</tspan><tspan x="1371.0" dy="31.05">memory is not success.</tspan></text><text x="1351.0" y="1174.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1174.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Measure unsupported answers and unnecessary</tspan><tspan x="1371.0" dy="31.05">clarification/abstention across multilingual and</tspan><tspan x="1371.0" dy="31.05">ambiguous questions.</tspan></text><text x="1351.0" y="1282.65" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1282.65" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Self-reported model confidence is not calibrated</tspan><tspan x="1371.0" dy="31.05">certainty; examine evidence and consequences of</tspan><tspan x="1371.0" dy="31.05">missing details.</tspan></text><rect x="72" y="1413.8000000000002" width="1856" height="144.8" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1449.8000000000002" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">ILLUSTRATIVE EXAMPLE</tspan></text><text x="96" y="1486.8000000000002" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">The user prefers short replies but requests a detailed Jaipur checklist today. Give detail using the latest supported budget and hotel preference. If no booked hotel appears</tspan><tspan x="96" dy="32.400000000000006">in history, acknowledge the gap.</tspan></text><rect x="72" y="1578.6000000000001" width="1856" height="112.4" rx="14" fill="#fff0cf" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1614.6000000000001" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">REMAINING WORK / DECISION</tspan></text><text x="96" y="1651.6000000000001" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Unbuilt: response states, sources and task-quality evaluation. Define normal, ambiguous, corrected, forgotten and failed behavior in one journey.</tspan></text><text x="72" y="1737.0000000000002" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700"><tspan x="72" dy="0">MENTOR DISCUSSION What makes memory useful, and when should Kivi clarify rather than offer a partial draft?</tspan></text><path d="M 72,1772.4000000000003 L 1928,1772.4000000000003" fill="none" stroke="#ccd9cf" stroke-width="2.5" stroke-linejoin="round"   /><text x="72" y="1805.4000000000003" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="72" dy="0">Source: ARCHITECTURE.md §§0.1–0.4, 7–9; guide 05–06 | Canonical plan revision 1.1 | 6 September 2026</tspan></text></svg>