<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1890" viewBox="0 0 2000 1890" role="img" aria-labelledby="title desc"><title id="title">What a memory contains and how it is stored</title><desc id="desc">A memory is an attributed claim with evidence and qualified applicability. Twelve content labels organize shared records; they do not create twelve databases or isolated retrieval routes. Implement actual SQL constraints, migrations, predicate rules and evidence mappings. The schema is currently a reviewed logical contract; no product database implementation exists.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfa"/><text x="72" y="53" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">GOLDEN GOOSE / MENTOR REVIEW / 04</tspan></text><text x="72" y="119" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700"><tspan x="72" dy="0">What a memory contains and how it is stored</tspan></text><text x="72" y="164" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="72" dy="0">One SQLite database holds source evidence, versioned interpretations and independent search representations.</tspan></text><rect x="72" y="190.4" width="1856" height="46" rx="7" fill="#fff0cf" stroke="#fff0cf" stroke-width="1.5"/><text x="88" y="216.4" fill="#73501b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="88" dy="0">STATUS: REVIEWED PLAN • APPLICATION IMPLEMENTATION PENDING • TARGETS ARE NOT MEASURED RESULTS</tspan></text><text x="72" y="284.4" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="72" dy="0">A memory is an attributed claim with evidence and qualified applicability. Twelve content labels organize shared records; they do not create twelve databases or</tspan><tspan x="72" dy="33.75">isolated retrieval routes.</tspan></text><text x="72" y="371.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">PARALLEL REPRESENTATIONS</tspan></text><rect x="72.0" y="391.9" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="431.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96.0" dy="0">01</tspan></text><text x="96.0" y="472.9" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Source evidence</tspan></text><text x="96.0" y="514.9" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96.0" dy="0">Preserve original text and metadata under a source</tspan><tspan x="96.0" dy="32.400000000000006">revision. Current permitted projections govern how</tspan><tspan x="96.0" dy="32.400000000000006">this evidence can be used.</tspan></text><rect x="700.0" y="391.9" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="431.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="724.0" dy="0">02</tspan></text><text x="724.0" y="472.9" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Supported interpretation</tspan></text><text x="724.0" y="514.9" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="724.0" dy="0">Store subject, predicate, typed value, units, scope,</tspan><tspan x="724.0" dy="32.400000000000006">time, attribution, modality, evidence and lifecycle.</tspan><tspan x="724.0" dy="32.400000000000006">Keep prior revisions and accepted decisions.</tspan></text><rect x="1328.0" y="391.9" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="431.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1352.0" dy="0">03</tspan></text><text x="1352.0" y="472.9" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Independent indexes</tspan></text><text x="1352.0" y="514.9" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1352.0" dy="0">Index allowed sources even when no memory is</tspan><tspan x="1352.0" dy="32.400000000000006">admitted. Build memory keyword/vector indexes</tspan><tspan x="1352.0" dy="32.400000000000006">separately; record revisions, configuration and</tspan><tspan x="1352.0" dy="32.400000000000006">readiness.</tspan></text><rect x="72.0" y="682.5" width="600.0" height="556.5999999999999" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="732.5" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Core schema contracts</tspan></text><text x="95.0" y="781.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="781.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Memory form: semantic knowledge, episodic</tspan><tspan x="115.0" dy="31.05">experience or a user-authorized reusable</tspan><tspan x="115.0" dy="31.05">procedure.</tspan></text><text x="95.0" y="889.65" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="889.65" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Separate direct statement, tool observation,</tspan><tspan x="115.0" dy="31.05">inference and summary; derived material retains its</tspan><tspan x="115.0" dy="31.05">dependencies.</tspan></text><text x="95.0" y="997.8" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="997.8" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Evidence links exact memory/source revisions and</tspan><tspan x="115.0" dy="31.05">spans. Scope and time qualify the claim.</tspan></text><text x="95.0" y="1074.8999999999999" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1074.8999999999999" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Source/memory heads, aliases/edges, exclusions,</tspan><tspan x="115.0" dy="31.05">jobs, operation receipts and owner revisions</tspan><tspan x="115.0" dy="31.05">preserve lifecycle and auditability.</tspan></text><rect x="700.0" y="682.5" width="600.0" height="556.5999999999999" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="732.5" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Content labels 1–6</tspan></text><text x="723.0" y="781.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="781.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">1. Entities and attributes: people, organizations,</tspan><tspan x="743.0" dy="31.05">equipment and stated capabilities.</tspan></text><text x="723.0" y="858.6" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="858.6" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">2. Relationships and roles: family, teams, ownership</tspan><tspan x="743.0" dy="31.05">and responsibility.</tspan></text><text x="723.0" y="935.7" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="935.7" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">3. Preferences and priorities: likes, style and</tspan><tspan x="743.0" dy="31.05">contextual tradeoffs.</tspan></text><text x="723.0" y="1012.8000000000001" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1012.8000000000001" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">4. Constraints and requirements: budgets, units,</tspan><tspan x="743.0" dy="31.05">limits and conditions.</tspan></text><text x="723.0" y="1089.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1089.9" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">5. Routines and recurring patterns: supported</tspan><tspan x="743.0" dy="31.05">regular behavior.</tspan></text><text x="723.0" y="1167.0" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1167.0" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">6. Goals and desired outcomes: aspirations,</tspan><tspan x="743.0" dy="31.05">separate from promises.</tspan></text><rect x="1328.0" y="682.5" width="600.0" height="556.5999999999999" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="732.5" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Content labels 7–12</tspan></text><text x="1351.0" y="781.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="781.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">7. Plans, tasks and commitments: distinct intention</tspan><tspan x="1371.0" dy="31.05">and obligation types.</tspan></text><text x="1351.0" y="858.6" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="858.6" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">8. Decisions and stated reasons: accepted choices;</tspan><tspan x="1371.0" dy="31.05">preserve reasons only when stated.</tspan></text><text x="1351.0" y="935.7" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="935.7" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">9. Progress, blockers and issues: task state,</tspan><tspan x="1371.0" dy="31.05">dependencies and questions.</tspan></text><text x="1351.0" y="1012.8000000000001" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1012.8000000000001" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">10. Beliefs, ideas and hypotheses: attributed</tspan><tspan x="1371.0" dy="31.05">thought, not confirmed truth.</tspan></text><text x="1351.0" y="1089.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1089.9" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">11. Personal vocabulary: what a term refers to or</tspan><tspan x="1371.0" dy="31.05">means.</tspan></text><text x="1351.0" y="1167.0" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1167.0" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">12. Resources and references: files, links and</tspan><tspan x="1371.0" dy="31.05">locations; no implied access.</tspan></text><rect x="72" y="1267.1" width="1856" height="144.8" rx="14" fill="#e1eff4" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1303.1" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">TERMS IN THIS IMAGE</tspan></text><text x="96" y="1340.1" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Predicate = the relationship or property being asserted. Modality = fact, intention, belief or condition. Polarity = positive or negated meaning. Head = current selected</tspan><tspan x="96" dy="32.400000000000006">version; older versions retain their history.</tspan></text><rect x="72" y="1431.8999999999999" width="1856" height="144.8" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1467.8999999999999" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">ILLUSTRATIVE EXAMPLE</tspan></text><text x="96" y="1504.8999999999999" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">“For the Jaipur trip, our total hotel budget is INR 6,000” → category: constraint; value: 6000; currency: INR; scope: Jaipur trip; meaning: total hotel budget; evidence: exact</tspan><tspan x="96" dy="32.400000000000006">phrase. It does not imply INR 6,000 per night.</tspan></text><rect x="72" y="1596.6999999999998" width="1856" height="144.8" rx="14" fill="#fff0cf" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1632.6999999999998" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">REMAINING WORK / DECISION</tspan></text><text x="96" y="1669.6999999999998" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Implement actual SQL constraints, migrations, predicate rules and evidence mappings. The schema is currently a reviewed logical contract; no product database</tspan><tspan x="96" dy="32.400000000000006">implementation exists.</tspan></text><text x="72" y="1787.4999999999998" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700"><tspan x="72" dy="0">MENTOR DISCUSSION Which structured fields are essential to reliable behavior, and which can wait for demonstrated value?</tspan></text><path d="M 72,1822.8999999999999 L 1928,1822.8999999999999" fill="none" stroke="#ccd9cf" stroke-width="2.5" stroke-linejoin="round"   /><text x="72" y="1855.8999999999999" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="72" dy="0">Source: Architecture §§1–4, 9–10; brief pp.4–6 | Canonical plan revision 1.1 | 6 September 2026</tspan></text></svg>