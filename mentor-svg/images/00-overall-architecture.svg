<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1781" viewBox="0 0 2000 1781" role="img" aria-labelledby="title desc"><title id="title">Golden Goose — overall architecture</title><desc id="desc">Two entry routes share one application and a source-backed MemoryService. All product components are planned and unbuilt. The only executed evidence is an isolated storage probe.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfa"/><text x="72" y="53" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">GOLDEN GOOSE / MENTOR REVIEW / 00</tspan></text><text x="72" y="120" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700"><tspan x="72" dy="0">The complete architecture, at a glance</tspan></text><text x="72" y="164" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="72" dy="0">Recall useful history → understand supported changes → apply context → inspect and control.</tspan></text><rect x="72" y="190" width="568" height="48" rx="8" fill="#f0f5f0" stroke="#f0f5f0" stroke-width="1.5"/><text x="86" y="219" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="86" dy="0">DOCUMENTED: architecture + research</tspan></text><rect x="660" y="190" width="566" height="48" rx="8" fill="#e1eff4" stroke="#e1eff4" stroke-width="1.5"/><text x="674" y="219" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="674" dy="0">EXECUTED: isolated SQL probe, 12/12</tspan></text><rect x="1246" y="190" width="682" height="48" rx="8" fill="#fff0cf" stroke="#fff0cf" stroke-width="1.5"/><text x="1260" y="219" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1260" dy="0">NOT BUILT: application, corpus, model integration, evaluation</tspan></text><rect x="1080" y="270" width="848" height="1020" rx="18" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="1110" y="317" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700"><tspan x="1110" dy="0">MEMORYSERVICE · one logical subsystem</tspan></text><text x="1110" y="352" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400"><tspan x="1110" dy="0">One SQLite file · trusted user scope · evidence and revision checks</tspan></text><rect x="72" y="300" width="390" height="192.2" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="349" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96" dy="0">Historical transcripts</tspan></text><text x="96" y="391" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Raw ASR + formatted output +</tspan><tspan x="96" dy="32.400000000000006">available metadata. One paired</tspan><tspan x="96" dy="32.400000000000006">observation. [01–02]</tspan></text><rect x="540" y="300" width="460" height="192.2" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="564" y="349" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="564" dy="0">Validate and import</tspan></text><text x="564" y="391" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="564" dy="0">Persist permitted original sources</tspan><tspan x="564" dy="32.400000000000006">before learning. Account for rows,</tspan><tspan x="564" dy="32.400000000000006">revisions and jobs. [02]</tspan></text><rect x="1120" y="390" width="768" height="206" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1144" y="439" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1144" dy="0">Durable source and memory store</tspan></text><text x="1144" y="481" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1144" dy="0">Original revisions + supported interpretations + exact evidence +</tspan><tspan x="1144" dy="32.400000000000006">entity/time links. Source and memory indexes remain independent.</tspan><tspan x="1144" dy="32.400000000000006">[04–05, 11]</tspan></text><rect x="72" y="670" width="390" height="224.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="719" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96" dy="0">Hey Kivi request</tspan></text><text x="96" y="761" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Typed request through the final</tspan><tspan x="96" dy="32.400000000000006">UI or intermediate CLI. Current</tspan><tspan x="96" dy="32.400000000000006">input is immediately private to</tspan><tspan x="96" dy="32.400000000000006">its run. [07, 12]</tspan></text><rect x="540" y="670" width="460" height="215" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="564" y="719" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="564" dy="0">Request coordinator</tspan></text><text x="564" y="761" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="564" dy="0">Retrieve → interpret → commit</tspan><tspan x="564" dy="32.400000000000006">controls → release allowed learning →</tspan><tspan x="564" dy="32.400000000000006">continue → validate and publish. [07]</tspan></text><rect x="1120" y="670" width="370" height="285" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1144" y="719" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1144" dy="0">Background learner</tspan></text><text x="1144" y="761" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1144" dy="0">Use the shared model adapter</tspan><tspan x="1144" dy="32.400000000000006">to extract supported claims</tspan><tspan x="1144" dy="32.400000000000006">from permitted sources.</tspan><tspan x="1144" dy="32.400000000000006">Record outcomes off the</tspan><tspan x="1144" dy="32.400000000000006">ordinary answer path. [03, 10]</tspan></text><rect x="1518" y="670" width="370" height="285" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1542" y="719" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1542" dy="0">Evidence retrieval</tspan></text><text x="1542" y="761" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1542" dy="0">Search sources and</tspan><tspan x="1542" dy="32.400000000000006">memories; verify spans,</tspan><tspan x="1542" dy="32.400000000000006">combine records and report</tspan><tspan x="1542" dy="32.400000000000006">gaps. Vectors are optional;</tspan><tspan x="1542" dy="32.400000000000006">benefit unmeasured. [06]</tspan></text><rect x="1120" y="1030" width="768" height="192.2" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1144" y="1079" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1144" dy="0">Inspect, remember, correct, forget or delete</tspan></text><text x="1144" y="1121" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1144" dy="0">Apply current controls atomically. Every history read, source</tspan><tspan x="1144" dy="32.400000000000006">fallback, worker completion and replay must respect current</tspan><tspan x="1144" dy="32.400000000000006">exclusions. [09]</tspan></text><rect x="72" y="1050" width="390" height="257.0" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1099" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96" dy="0">User-visible result</tspan></text><text x="96" y="1141" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Supported answer/draft,</tspan><tspan x="96" dy="32.400000000000006">focused question, honest</tspan><tspan x="96" dy="32.400000000000006">unknown or observed action</tspan><tspan x="96" dy="32.400000000000006">outcome; sources available. [08,</tspan><tspan x="96" dy="32.400000000000006">12]</tspan></text><rect x="540" y="1040" width="460" height="235" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="564" y="1089" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="564" dy="0">Model and tool adapters</tspan></text><text x="564" y="1131" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="564" dy="0">NVIDIA/DeepSeek interprets; code</tspan><tspan x="564" dy="32.400000000000006">validates. Only currently authorized</tspan><tspan x="564" dy="32.400000000000006">tools execute and produce receipts.</tspan><tspan x="564" dy="32.400000000000006">[10]</tspan></text><path d="M 462,391 L 540,391" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1000,391 L 1050,391 L 1050,455 L 1120,455" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1305,596 L 1305,670" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><path d="M 1703,596 L 1703,670" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 462,777 L 540,777" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1000,741 L 1035,741 L 1035,630 L 1703,630 L 1703,670" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><text x="1053" y="621" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1053" dy="0">query</tspan></text><path d="M 1703,955 L 1703,994 L 1038,994 L 1038,825 L 1000,825" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><text x="1245" y="985" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1245" dy="0">permitted evidence + freshness token</tspan></text><path d="M 540,836 L 510,836 L 510,1163 L 462,1163" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 770,885 L 770,1040" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><text x="791" y="966" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="791" dy="0">proposals / observations</tspan></text><path d="M 1000,863 L 1059,863 L 1059,1101 L 1120,1101" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1888,1090 L 1911,1090 L 1911,551 L 1888,551" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><text x="1114" y="1258" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700"><tspan x="1114" dy="0">All saved knowledge and source fallback obey one permitted-text boundary.</tspan></text><rect x="72" y="1335" width="1856" height="144.8" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1371" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">CROSS-CUTTING PROOF AND OPERATIONS</tspan></text><text x="96" y="1408" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Short transactions, durable jobs, idempotency, checked freshness and bounded retries [11]. Trace actual decisions and measure the complete pipeline [13]. Ship</tspan><tspan x="96" dy="32.400000000000006">reproducible setup, new-corpus import and reset [14].</tspan></text><rect x="72" y="1503.8" width="1856" height="144.8" rx="14" fill="#fff0cf" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1539.8" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">NEXT / WHAT TO ASK YOUR MENTOR</tspan></text><text x="96" y="1576.8" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Select one worthwhile journey and its failure states. Build persistent source search and one cited-answer path with controls. Add memory complexity through measured</tspan><tspan x="96" dy="32.400000000000006">comparisons. Review open product, model and evaluation choices in [15].</tspan></text><text x="72" y="1694.6" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700"><tspan x="72" dy="0">Reading order: 00 overview → 01 purpose → 02–11 mechanisms → 12 experience → 13 proof → 14 review path → 15 next decisions.</tspan></text><text x="72" y="1741.6" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="72" dy="0">Planning visualization, not a working Kivi product. Sources: Golden Goose brief pp.2–7 and ARCHITECTURE.md revision 1.1 · 6 September 2026</tspan></text></svg>