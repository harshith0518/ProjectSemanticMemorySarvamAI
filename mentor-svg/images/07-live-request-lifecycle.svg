<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2071" viewBox="0 0 2000 2071" role="img" aria-labelledby="title desc"><title id="title">From a live request to a trustworthy response</title><desc id="desc">Answer from permitted evidence; commit explicit controls before dependent effects or success claims. Build coordinator and disposition/publication transactions. Test missed controls, corrections during answering, late cancelled outputs and the freshness exception through the actual UI/backend.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfa"/><text x="72" y="53" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">GOLDEN GOOSE / MENTOR REVIEW / 07</tspan></text><text x="72" y="119" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700"><tspan x="72" dy="0">From a live request to a trustworthy response</tspan></text><text x="72" y="164" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="72" dy="0">Designed; application unbuilt · Separate answer and learning lifecycles.</tspan></text><rect x="72" y="190.4" width="1856" height="46" rx="7" fill="#fff0cf" stroke="#fff0cf" stroke-width="1.5"/><text x="88" y="216.4" fill="#73501b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="88" dy="0">STATUS: REVIEWED PLAN • APPLICATION IMPLEMENTATION PENDING • TARGETS ARE NOT MEASURED RESULTS</tspan></text><text x="72" y="284.4" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="72" dy="0">Answer from permitted evidence; commit explicit controls before dependent effects or success claims.</tspan></text><text x="72" y="338.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">PROCESS / READ THE NUMBERED STEPS</tspan></text><rect x="72.0" y="358.15" width="443.0" height="289.0" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96.0" dy="0">01</tspan></text><text x="96.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Accept privately</tspan></text><text x="96.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96.0" dy="0">Persist request identity and private</tspan><tspan x="96.0" dy="32.400000000000006">input. Hold learning; other requests</tspan><tspan x="96.0" dy="32.400000000000006">cannot retrieve this source yet.</tspan></text><rect x="543.0" y="358.15" width="443.0" height="289.0" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="567.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="567.0" dy="0">02</tspan></text><text x="567.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="567.0" dy="0">Gather evidence</tspan></text><text x="567.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="567.0" dy="0">Read permitted memories, sources</tspan><tspan x="567.0" dy="32.400000000000006">and conversation coherently. Include</tspan><tspan x="567.0" dy="32.400000000000006">current input; close transactions</tspan><tspan x="567.0" dy="32.400000000000006">before model calls.</tspan></text><rect x="1014.0" y="358.15" width="443.0" height="289.0" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1038.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1038.0" dy="0">03</tspan></text><text x="1038.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1038.0" dy="0">Interpret once</tspan></text><text x="1038.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1038.0" dy="0">Validate proposed controls plus one</tspan><tspan x="1038.0" dy="32.400000000000006">choice: answer, retrieve, propose</tspan><tspan x="1038.0" dy="32.400000000000006">action, clarify or abstain.</tspan></text><rect x="1485.0" y="358.15" width="443.0" height="289.0" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1509.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1509.0" dy="0">04</tspan></text><text x="1509.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1509.0" dy="0">Commit controls</tspan></text><text x="1509.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1509.0" dy="0">Atomically validate compatible</tspan><tspan x="1509.0" dy="32.400000000000006">changes. Unresolved or failed</tspan><tspan x="1509.0" dy="32.400000000000006">controls hold dependent effects and</tspan><tspan x="1509.0" dy="32.400000000000006">saved-success claims.</tspan></text><rect x="1485.0" y="709.15" width="443.0" height="289.0" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1509.0" y="749.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1509.0" dy="0">05</tspan></text><text x="1509.0" y="790.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1509.0" dy="0">Release surviving text</tspan></text><text x="1509.0" y="832.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1509.0" dy="0">After valid disposition, publish</tspan><tspan x="1509.0" dy="32.400000000000006">permitted text and release learning.</tspan><tspan x="1509.0" dy="32.400000000000006">Forgotten repetitions remain</tspan><tspan x="1509.0" dy="32.400000000000006">excluded; unresolved handling keeps</tspan><tspan x="1509.0" dy="32.400000000000006">learning held.</tspan></text><rect x="1014.0" y="709.15" width="443.0" height="289.0" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1038.0" y="749.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1038.0" dy="0">06</tspan></text><text x="1038.0" y="790.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1038.0" dy="0">Continue</tspan></text><text x="1038.0" y="832.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1038.0" dy="0">Refresh stale knowledge; otherwise</tspan><tspan x="1038.0" dy="32.400000000000006">answer, retrieve or execute an</tspan><tspan x="1038.0" dy="32.400000000000006">authorized tool. Return actual</tspan><tspan x="1038.0" dy="32.400000000000006">observations to the model.</tspan></text><rect x="543.0" y="709.15" width="443.0" height="289.0" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="567.0" y="749.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="567.0" dy="0">07</tspan></text><text x="567.0" y="790.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="567.0" dy="0">Accept response</tspan></text><text x="567.0" y="832.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="567.0" dy="0">Atomically check fresh knowledge,</tspan><tspan x="567.0" dy="32.400000000000006">run and permissions; save buffered</tspan><tspan x="567.0" dy="32.400000000000006">output, outcome and publication</tspan><tspan x="567.0" dy="32.400000000000006">order.</tspan></text><rect x="72.0" y="709.15" width="443.0" height="289.0" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="749.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96.0" dy="0">08</tspan></text><text x="96.0" y="790.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Deliver or replay</tspan></text><text x="96.0" y="832.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96.0" dy="0">Return committed output and actual</tspan><tspan x="96.0" dy="32.400000000000006">status. Replay obeys current</tspan><tspan x="96.0" dy="32.400000000000006">exclusions; already delivered bytes</tspan><tspan x="96.0" dy="32.400000000000006">cannot be retracted.</tspan></text><path d="M 515.0,502.65 L 543.0,502.65" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 986.0,502.65 L 1014.0,502.65" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1457.0,502.65 L 1485.0,502.65" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1706.5,647.15 L 1706.5,709.15" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1485.0,853.65 L 1457.0,853.65" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1014.0,853.65 L 986.0,853.65" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 543.0,853.65 L 515.0,853.65" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><rect x="72.0" y="1032.15" width="600.0" height="387.4" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="1082.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Two lanes, one service</tspan></text><text x="95.0" y="1131.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1131.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Current input is available before extraction; ordinary</tspan><tspan x="115.0" dy="31.05">learning runs separately.</tspan></text><text x="95.0" y="1208.25" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1208.25" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Explicit remember, correct and forget must commit</tspan><tspan x="115.0" dy="31.05">before acknowledgement.</tspan></text><text x="95.0" y="1285.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1285.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Independent drafts can continue with an honest</tspan><tspan x="115.0" dy="31.05">unsaved or partial status.</tspan></text><rect x="700.0" y="1032.15" width="600.0" height="387.4" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="1082.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">One-call freshness exception</tspan></text><text x="723.0" y="1131.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1131.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Only the service can rebase the captured freshness</tspan><tspan x="743.0" dy="31.05">token after publishing this run&#x27;s already-seen</tspan><tspan x="743.0" dy="31.05">permitted input.</tspan></text><text x="723.0" y="1239.3000000000002" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1239.3000000000002" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Require an exact prior revision match, unchanged</tspan><tspan x="743.0" dy="31.05">permitted digest, promotion as the sole change and</tspan><tspan x="743.0" dy="31.05">no meaning-changing control or intervening write.</tspan></text><text x="723.0" y="1347.4500000000003" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1347.4500000000003" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Recheck the resulting revision at publication; every</tspan><tspan x="743.0" dy="31.05">other change follows normal refresh.</tspan></text><rect x="1328.0" y="1032.15" width="600.0" height="387.4" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="1082.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Bounded execution defaults</tspan></text><text x="1351.0" y="1131.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1131.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Target one ordinary answer call; maximum four</tspan><tspan x="1371.0" dy="31.05">attempts including repairs and retries.</tspan></text><text x="1351.0" y="1208.25" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1208.25" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Maximum six follow-up reads, one external effect</tspan><tspan x="1371.0" dy="31.05">and 30 seconds; validate these defaults.</tspan></text><text x="1351.0" y="1285.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1285.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">One eligible transient retry per call within total limits;</tspan><tspan x="1371.0" dy="31.05">exhaustion returns partial or error status.</tspan></text><rect x="72" y="1447.5500000000002" width="1856" height="144.8" rx="14" fill="#e1eff4" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1483.5500000000002" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">TERMS IN THIS IMAGE</tspan></text><text x="96" y="1520.5500000000002" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Private input = visible only within this request until released. A freshness token records the read versions. Rebase = let the service update that token only under the exact</tspan><tspan x="96" dy="32.400000000000006">exception described above. Digest = fingerprint of permitted text.</tspan></text><rect x="72" y="1612.3500000000001" width="1856" height="144.8" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1648.3500000000001" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">ILLUSTRATIVE EXAMPLE</tspan></text><text x="96" y="1685.3500000000001" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">“Forget the Jaipur budget, then make a checklist.” Commit forgetting, exclude its repetition in this input, release surviving text and refresh evidence. Acknowledge the actual</tspan><tspan x="96" dy="32.400000000000006">commit and draft without that budget.</tspan></text><rect x="72" y="1777.15" width="1856" height="144.8" rx="14" fill="#fff0cf" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1813.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">REMAINING WORK / DECISION</tspan></text><text x="96" y="1850.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Build coordinator and disposition/publication transactions. Test missed controls, corrections during answering, late cancelled outputs and the freshness exception through</tspan><tspan x="96" dy="32.400000000000006">the actual UI/backend.</tspan></text><text x="72" y="1967.95" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700"><tspan x="72" dy="0">MENTOR DISCUSSION Does this order preserve user trust while keeping ordinary supported answers fast enough?</tspan></text><path d="M 72,2003.3500000000001 L 1928,2003.3500000000001" fill="none" stroke="#ccd9cf" stroke-width="2.5" stroke-linejoin="round"   /><text x="72" y="2036.3500000000001" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="72" dy="0">Source: Architecture §§5–8, 12.3; status §14 | Canonical plan revision 1.1 | 6 September 2026</tspan></text></svg>