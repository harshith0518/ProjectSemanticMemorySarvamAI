<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1886" viewBox="0 0 2000 1886" role="img" aria-labelledby="title desc"><title id="title">Remember, correct, forget and inspect</title><desc id="desc">Change the system&#x27;s understanding through ordinary language and simple controls, with inspectable results. Build controls with source search. Define sensitive-data and retention UX; test fallback, stale jobs, aliases, replay, reimport and mixed-source rebuilding after controls.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfa"/><text x="72" y="53" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">GOLDEN GOOSE / MENTOR REVIEW / 09</tspan></text><text x="72" y="119" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700"><tspan x="72" dy="0">Remember, correct, forget and inspect</tspan></text><text x="72" y="164" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="72" dy="0">Designed; application unbuilt · Controls cover every information route.</tspan></text><rect x="72" y="190.4" width="1856" height="46" rx="7" fill="#fff0cf" stroke="#fff0cf" stroke-width="1.5"/><text x="88" y="216.4" fill="#73501b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="88" dy="0">STATUS: REVIEWED PLAN • APPLICATION IMPLEMENTATION PENDING • TARGETS ARE NOT MEASURED RESULTS</tspan></text><text x="72" y="284.4" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="72" dy="0">Change the system&#x27;s understanding through ordinary language and simple controls, with inspectable results.</tspan></text><text x="72" y="338.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">PROCESS / READ THE NUMBERED STEPS</tspan></text><rect x="72.0" y="358.15" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96.0" dy="0">01</tspan></text><text x="96.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Resolve intent and scope</tspan></text><text x="96.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96.0" dy="0">Identify the control, trusted ownership, target</tspan><tspan x="96.0" dy="32.400000000000006">revision, topic and time. Clarify material ambiguity;</tspan><tspan x="96.0" dy="32.400000000000006">explicit UI controls can supply IDs.</tspan></text><rect x="700.0" y="358.15" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="724.0" dy="0">02</tspan></text><text x="724.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Validate the batch</tspan></text><text x="724.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="724.0" dy="0">Check current-request support and compatible</tspan><tspan x="724.0" dy="32.400000000000006">target changes. Skipped clarification is not</tspan><tspan x="724.0" dy="32.400000000000006">confirmation; unresolved controls cannot claim</tspan><tspan x="724.0" dy="32.400000000000006">success.</tspan></text><rect x="1328.0" y="358.15" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1352.0" dy="0">03</tspan></text><text x="1352.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Commit together</tspan></text><text x="1352.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1352.0" dy="0">Update knowledge, exclusions, permitted text and</tspan><tspan x="1352.0" dy="32.400000000000006">affected indexes or links atomically; record the</tspan><tspan x="1352.0" dy="32.400000000000006">service-issued receipt.</tspan></text><rect x="1328.0" y="676.75" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="716.75" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1352.0" dy="0">04</tspan></text><text x="1352.0" y="757.75" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Remove dependent use</tspan></text><text x="1352.0" y="799.75" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1352.0" dy="0">Suppress affected vectors, jobs, aliases,</tspan><tspan x="1352.0" dy="32.400000000000006">summaries, prompts, artifacts and retained</tspan><tspan x="1352.0" dy="32.400000000000006">answers. Rebuild mixed-source knowledge from</tspan><tspan x="1352.0" dy="32.400000000000006">surviving permitted evidence.</tspan></text><rect x="700.0" y="676.75" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="716.75" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="724.0" dy="0">05</tspan></text><text x="724.0" y="757.75" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Enforce on every read</tspan></text><text x="724.0" y="799.75" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="724.0" dy="0">Source fallback, full-history answers, extraction,</tspan><tspan x="724.0" dy="32.400000000000006">inspection and replay share the permitted-text</tspan><tspan x="724.0" dy="32.400000000000006">boundary. Stale embeddings cannot reveal excluded</tspan><tspan x="724.0" dy="32.400000000000006">meaning.</tspan></text><rect x="72.0" y="676.75" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="716.75" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96.0" dy="0">06</tspan></text><text x="96.0" y="757.75" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Explain and preserve outcome</tspan></text><text x="96.0" y="799.75" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96.0" dy="0">Show actual status and retention scope. Stale</tspan><tspan x="96.0" dy="32.400000000000006">workers and reimports respect suppression;</tspan><tspan x="96.0" dy="32.400000000000006">restoration requires an explicit, separately defined</tspan><tspan x="96.0" dy="32.400000000000006">operation.</tspan></text><path d="M 672.0,486.45 L 700.0,486.45" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1300.0,486.45 L 1328.0,486.45" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1628.0,614.75 L 1628.0,676.75" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1328.0,805.05 L 1300.0,805.05" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 700.0,805.05 L 672.0,805.05" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><rect x="72.0" y="967.35" width="600.0" height="464.5" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="1017.35" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Four meanings</tspan></text><text x="95.0" y="1066.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1066.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Remember retains a supported assertion within its</tspan><tspan x="115.0" dy="31.05">scope.</tspan></text><text x="95.0" y="1143.4499999999998" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1143.4499999999998" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Correct fixes an earlier mistake; real-world change</tspan><tspan x="115.0" dy="31.05">preserves the earlier value&#x27;s historical meaning.</tspan></text><text x="95.0" y="1220.5499999999997" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1220.5499999999997" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Forget blocks selected information and known</tspan><tspan x="115.0" dy="31.05">supporting spans; disclose whether original history</tspan><tspan x="115.0" dy="31.05">remains.</tspan></text><text x="95.0" y="1328.6999999999998" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1328.6999999999998" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Delete source removes specified in-application</tspan><tspan x="115.0" dy="31.05">content and affected derivatives; report purge</tspan><tspan x="115.0" dy="31.05">status.</tspan></text><rect x="700.0" y="967.35" width="600.0" height="464.5" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="1017.35" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">One permitted-text boundary</tspan></text><text x="723.0" y="1066.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1066.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Check trusted scope, visibility, selected revision,</tspan><tspan x="743.0" dy="31.05">exclusions and supported time constraints.</tspan></text><text x="723.0" y="1143.4499999999998" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1143.4499999999998" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Map surviving text to original spans; suppress</tspan><tspan x="743.0" dy="31.05">chunks when safe reconstruction is unavailable.</tspan></text><text x="723.0" y="1220.5499999999997" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1220.5499999999997" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Even private input obeys exclusions after controls;</tspan><tspan x="743.0" dy="31.05">forgotten repetitions must not be relearned.</tspan></text><rect x="1328.0" y="967.35" width="600.0" height="464.5" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="1017.35" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Inspection and honest boundaries</tspan></text><text x="1351.0" y="1066.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1066.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Show memory meaning, source spans, changes</tspan><tspan x="1371.0" dy="31.05">and concise reasons without requiring database</tspan><tspan x="1371.0" dy="31.05">administration.</tspan></text><text x="1351.0" y="1174.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1174.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Exports, user files, backups and provider retention</tspan><tspan x="1371.0" dy="31.05">are separate deletion boundaries.</tspan></text><text x="1351.0" y="1251.6" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1251.6" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Previously delivered text cannot be retracted;</tspan><tspan x="1371.0" dy="31.05">arbitrary future paraphrases cannot be universally</tspan><tspan x="1371.0" dy="31.05">recognized.</tspan></text><rect x="72" y="1459.85" width="1856" height="144.8" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1495.85" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">ILLUSTRATIVE EXAMPLE</tspan></text><text x="96" y="1532.85" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Changing the trip budget from INR 6,000 to INR 8,000 preserves the earlier value historically. Forgetting the resolved budget information blocks its known supporting spans</tspan><tspan x="96" dy="32.400000000000006">too. Deleting the original source is a separate request.</tspan></text><rect x="72" y="1624.6499999999999" width="1856" height="112.4" rx="14" fill="#fff0cf" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1660.6499999999999" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">REMAINING WORK / DECISION</tspan></text><text x="96" y="1697.6499999999999" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Build controls with source search. Define sensitive-data and retention UX; test fallback, stale jobs, aliases, replay, reimport and mixed-source rebuilding after controls.</tspan></text><text x="72" y="1783.05" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700"><tspan x="72" dy="0">MENTOR DISCUSSION Are the control names, scope choices and source-retention explanations understandable without exposing database mechanics?</tspan></text><path d="M 72,1818.45 L 1928,1818.45" fill="none" stroke="#ccd9cf" stroke-width="2.5" stroke-linejoin="round"   /><text x="72" y="1851.45" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="72" dy="0">Source: Architecture §§0.4, 4–8, 11.1, 12.3 | Canonical plan revision 1.1 | 6 September 2026</tspan></text></svg>