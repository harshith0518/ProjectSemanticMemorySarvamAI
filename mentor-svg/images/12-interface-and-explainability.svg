<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1952" viewBox="0 0 2000 1952" role="img" aria-labelledby="title desc"><title id="title">Make memory understandable in the application</title><desc id="desc">Connect the final normal-user interface to the same MemoryService as the CLI. Memory should improve the task without requiring the user to administer records or graph nodes. Select the concrete journey, frontend and application adapter. Build the answer/evidence/control experience and exercise it against real persisted state. No final user interface currently exists.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfa"/><text x="72" y="53" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">GOLDEN GOOSE / MENTOR REVIEW / 12</tspan></text><text x="72" y="119" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700"><tspan x="72" dy="0">Make memory understandable in the application</tspan></text><text x="72" y="164" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="72" dy="0">The person gets useful help and simple controls; an engineer can inspect the underlying decision.</tspan></text><rect x="72" y="190.4" width="1856" height="46" rx="7" fill="#fff0cf" stroke="#fff0cf" stroke-width="1.5"/><text x="88" y="216.4" fill="#73501b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="88" dy="0">STATUS: REVIEWED PLAN • APPLICATION IMPLEMENTATION PENDING • TARGETS ARE NOT MEASURED RESULTS</tspan></text><text x="72" y="284.4" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="72" dy="0">Connect the final normal-user interface to the same MemoryService as the CLI. Memory should improve the task without requiring the user to administer records or</tspan><tspan x="72" dy="33.75">graph nodes.</tspan></text><text x="72" y="371.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">PROCESS / READ THE NUMBERED STEPS</tspan></text><rect x="72.0" y="391.9" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="431.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96.0" dy="0">01</tspan></text><text x="96.0" y="472.9" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Ask naturally</tspan></text><text x="96.0" y="514.9" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96.0" dy="0">Enter a Hey Kivi request or replay transcript history.</tspan><tspan x="96.0" dy="32.400000000000006">Show processing state and allow cancellation;</tspan><tspan x="96.0" dy="32.400000000000006">native speech capture is optional.</tspan></text><rect x="700.0" y="391.9" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="431.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="724.0" dy="0">02</tspan></text><text x="724.0" y="472.9" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Receive a useful result</tspan></text><text x="724.0" y="514.9" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="724.0" dy="0">Present a supported answer, draft, clarification or</tspan><tspan x="724.0" dy="32.400000000000006">honest partial outcome. Apply current instructions</tspan><tspan x="724.0" dy="32.400000000000006">and relevant remembered context.</tspan></text><rect x="1328.0" y="391.9" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="431.9" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1352.0" dy="0">03</tspan></text><text x="1352.0" y="472.9" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Inspect the evidence</tspan></text><text x="1352.0" y="514.9" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1352.0" dy="0">Open the source interactions that support personal</tspan><tspan x="1352.0" dy="32.400000000000006">claims. Distinguish source text, learned</tspan><tspan x="1352.0" dy="32.400000000000006">interpretation, uncertainty and actual tool</tspan><tspan x="1352.0" dy="32.400000000000006">observations.</tspan></text><rect x="1328.0" y="710.5" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="750.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1352.0" dy="0">04</tspan></text><text x="1352.0" y="791.5" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Correct or forget</tspan></text><text x="1352.0" y="833.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1352.0" dy="0">Offer simple natural controls and an explicit targeted</tspan><tspan x="1352.0" dy="32.400000000000006">path. Acknowledge success only after the backend</tspan><tspan x="1352.0" dy="32.400000000000006">commits the change.</tspan></text><rect x="700.0" y="710.5" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="750.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="724.0" dy="0">05</tspan></text><text x="724.0" y="791.5" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">See future behavior change</tspan></text><text x="724.0" y="833.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="724.0" dy="0">A later request should respect corrected values and</tspan><tspan x="724.0" dy="32.400000000000006">exclusions. Reconnect/replay must not return a</tspan><tspan x="724.0" dy="32.400000000000006">stale forbidden answer.</tspan></text><path d="M 672.0,520.2 L 700.0,520.2" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1300.0,520.2 L 1328.0,520.2" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1628.0,648.5 L 1628.0,710.5" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1328.0,838.8 L 1300.0,838.8" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><rect x="72.0" y="1001.1" width="600.0" height="464.5" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="1051.1" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Normal-user surfaces</tspan></text><text x="95.0" y="1100.1" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1100.1" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Question and answer with usable sources, without</tspan><tspan x="115.0" dy="31.05">exposing database jargon.</tspan></text><text x="95.0" y="1177.1999999999998" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1177.1999999999998" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Ambiguity: one focused question or supported</tspan><tspan x="115.0" dy="31.05">alternatives; skipping preserves uncertainty.</tspan></text><text x="95.0" y="1254.2999999999997" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1254.2999999999997" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Remember/correct/forget and source deletion with</tspan><tspan x="115.0" dy="31.05">clear retention wording.</tspan></text><text x="95.0" y="1331.3999999999996" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1331.3999999999996" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Visible pending, unsaved, cancelled, failed and</tspan><tspan x="115.0" dy="31.05">unknown outcomes; no invented completion.</tspan></text><rect x="700.0" y="1001.1" width="600.0" height="464.5" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="1051.1" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Engineer inspection</tspan></text><text x="723.0" y="1100.1" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1100.1" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Input → created/changed/rejected memory →</tspan><tspan x="743.0" dy="31.05">retrieved evidence → resulting behavior.</tspan></text><text x="723.0" y="1177.1999999999998" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1177.1999999999998" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Show exact source revisions/spans, relevant</tspan><tspan x="743.0" dy="31.05">memory state, policy/configuration versions and</tspan><tspan x="743.0" dy="31.05">concise decision reasons.</tspan></text><text x="723.0" y="1285.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1285.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Expose stage readiness, worker failures, retries,</tspan><tspan x="743.0" dy="31.05">model usage, latency and cost basis.</tspan></text><text x="723.0" y="1362.4499999999998" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1362.4499999999998" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">The same permission/exclusion boundary applies to</tspan><tspan x="743.0" dy="31.05">retained trace content and source inspection.</tspan></text><rect x="1328.0" y="1001.1" width="600.0" height="464.5" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="1051.1" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Experience acceptance</tspan></text><text x="1351.0" y="1100.1" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1100.1" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Recall and changed-state answers work through</tspan><tspan x="1371.0" dy="31.05">the actual UI and persistent backend.</tspan></text><text x="1351.0" y="1177.1999999999998" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1177.1999999999998" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Correction, forgetting, ambiguous references and</tspan><tspan x="1371.0" dy="31.05">partial failures have coherent user-visible</tspan><tspan x="1371.0" dy="31.05">outcomes.</tspan></text><text x="1351.0" y="1285.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1285.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">The final product must be intelligible without a</tspan><tspan x="1371.0" dy="31.05">developer console or an explanation of the storage</tspan><tspan x="1371.0" dy="31.05">system.</tspan></text><text x="1351.0" y="1393.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1393.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">CLI and interface use one core implementation. The</tspan><tspan x="1371.0" dy="31.05">frontend/API framework remains undecided.</tspan></text><rect x="72" y="1493.6" width="1856" height="144.8" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1529.6" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">ILLUSTRATIVE EXAMPLE</tspan></text><text x="96" y="1566.6" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">User: “Why did you choose that budget?” → show the original update. User: “That was for Goa.” → resolve scope, commit the correction, and give the next Jaipur answer</tspan><tspan x="96" dy="32.400000000000006">from the corrected permitted history.</tspan></text><rect x="72" y="1658.3999999999999" width="1856" height="144.8" rx="14" fill="#fff0cf" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1694.3999999999999" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">REMAINING WORK / DECISION</tspan></text><text x="96" y="1731.3999999999999" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Select the concrete journey, frontend and application adapter. Build the answer/evidence/control experience and exercise it against real persisted state. No final user</tspan><tspan x="96" dy="32.400000000000006">interface currently exists.</tspan></text><text x="72" y="1849.1999999999998" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700"><tspan x="72" dy="0">MENTOR DISCUSSION Can someone verify and correct a result without becoming the administrator of the memory system?</tspan></text><path d="M 72,1884.6 L 1928,1884.6" fill="none" stroke="#ccd9cf" stroke-width="2.5" stroke-linejoin="round"   /><text x="72" y="1917.6" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="72" dy="0">Source: Brief pp.3–6; architecture §§0.4, 7, 11–12 | Canonical plan revision 1.1 | 6 September 2026</tspan></text></svg>