<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2089" viewBox="0 0 2000 2089" role="img" aria-labelledby="title desc"><title id="title">Prove quality with a reproducible evaluation</title><desc id="desc">Show where the system succeeds, abstains and fails. Use human-reviewed evidence and held-out cases to test generalization to unfamiliar dictation history. Build corpus, annotations, baselines, integrity tests and results. Proposed complexity gate: ≥3 net added successes/50, or preserved quality with ≥20% lower p95 latency or intended-horizon cost; no critical or temporal regression. Small differences may be inconclusive.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b54"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfa"/><text x="72" y="53" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">GOLDEN GOOSE / MENTOR REVIEW / 13</tspan></text><text x="72" y="119" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700"><tspan x="72" dy="0">Prove quality with a reproducible evaluation</tspan></text><text x="72" y="164" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="72" dy="0">Measure the complete product and compare added memory against simpler source-based approaches.</tspan></text><rect x="72" y="190.4" width="1856" height="46" rx="7" fill="#fff0cf" stroke="#fff0cf" stroke-width="1.5"/><text x="88" y="216.4" fill="#73501b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="88" dy="0">STATUS: REVIEWED PLAN • APPLICATION IMPLEMENTATION PENDING • TARGETS ARE NOT MEASURED RESULTS</tspan></text><text x="72" y="284.4" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400"><tspan x="72" dy="0">Show where the system succeeds, abstains and fails. Use human-reviewed evidence and held-out cases to test generalization to unfamiliar dictation history.</tspan></text><text x="72" y="338.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="72" dy="0">PROCESS / READ THE NUMBERED STEPS</tspan></text><rect x="72.0" y="358.15" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96.0" dy="0">01</tspan></text><text x="96.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Build realistic history</tspan></text><text x="96.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96.0" dy="0">Create about 500 paired records: recurring</tspan><tspan x="96.0" dy="32.400000000000006">people/events, distractors, changed facts, missing</tspan><tspan x="96.0" dy="32.400000000000006">metadata, ASR disagreements and multilingual</tspan><tspan x="96.0" dy="32.400000000000006">cases.</tspan></text><rect x="700.0" y="358.15" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="724.0" dy="0">02</tspan></text><text x="724.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Review questions and evidence</tspan></text><text x="724.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="724.0" dy="0">Propose 80 questions: 30 development, 50 sealed.</tspan><tspan x="724.0" dy="32.400000000000006">Separately audit 50 source records. Keep gold</tspan><tspan x="724.0" dy="32.400000000000006">answers and labels out of ingestion.</tspan></text><rect x="1328.0" y="358.15" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="398.15" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1352.0" dy="0">03</tspan></text><text x="1352.0" y="439.15" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Compare complete pipelines</tspan></text><text x="1352.0" y="481.15" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1352.0" dy="0">Hold answer model, instructions, scope and cutoffs</tspan><tspan x="1352.0" dy="32.400000000000006">constant. Compare full history, source keyword,</tspan><tspan x="1352.0" dy="32.400000000000006">source hybrid and hybrid with typed memories.</tspan></text><rect x="1328.0" y="676.75" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="716.75" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1352.0" dy="0">04</tspan></text><text x="1352.0" y="757.75" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Diagnose before tuning</tspan></text><text x="1352.0" y="799.75" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="1352.0" dy="0">Inspect admission, retrieval, evidence packing,</tspan><tspan x="1352.0" dy="32.400000000000006">answer support, controls and tools. Change one</tspan><tspan x="1352.0" dy="32.400000000000006">justified component using development failures.</tspan></text><rect x="700.0" y="676.75" width="600.0" height="256.6" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="716.75" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="724.0" dy="0">05</tspan></text><text x="724.0" y="757.75" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Freeze and report</tspan></text><text x="724.0" y="799.75" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="724.0" dy="0">Freeze the candidate before sealed evaluation.</tspan><tspan x="724.0" dy="32.400000000000006">Retain failures, denominators, traces and costs;</tspan><tspan x="724.0" dy="32.400000000000006">rehearse the reviewer path on the submitted code.</tspan></text><path d="M 672.0,486.45 L 700.0,486.45" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1300.0,486.45 L 1328.0,486.45" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1628.0,614.75 L 1628.0,676.75" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><path d="M 1328.0,805.05 L 1300.0,805.05" fill="none" stroke="#1d6b54" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)" /><rect x="72.0" y="967.35" width="600.0" height="634.75" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="96.0" y="1017.35" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="96.0" dy="0">Cases and leakage control</tspan></text><text x="95.0" y="1066.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1066.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Cover direct recall, multi-record evidence,</tspan><tspan x="115.0" dy="31.05">time/changes, insufficient/conflicted history and</tspan><tspan x="115.0" dy="31.05">contextual assistance.</tspan></text><text x="95.0" y="1174.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1174.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Proposed sealed split: 40 answerable + 10</tspan><tspan x="115.0" dy="31.05">insufficient/conflicting cases; source audit split: 20</tspan><tspan x="115.0" dy="31.05">development + 30 sealed.</tspan></text><text x="95.0" y="1282.65" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1282.65" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Separate whole narratives/templates; evaluate only</tspan><tspan x="115.0" dy="31.05">records available at the query cutoff and allowed by</tspan><tspan x="115.0" dy="31.05">current exclusions.</tspan></text><text x="95.0" y="1390.8000000000002" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1390.8000000000002" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Test English, Hindi/Hinglish, cross-language</tspan><tspan x="115.0" dy="31.05">queries, names, negation and ambiguous dates.</tspan><tspan x="115.0" dy="31.05">Hidden-corpus languages remain unknown.</tspan></text><text x="95.0" y="1498.9500000000003" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="95.0" dy="0">•</tspan></text><text x="115.0" y="1498.9500000000003" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="115.0" dy="0">Give the full-history baseline all permitted context</tspan><tspan x="115.0" dy="31.05">when it fits; disclose truncation and compare</tspan><tspan x="115.0" dy="31.05">availability fairly.</tspan></text><rect x="700.0" y="967.35" width="600.0" height="634.75" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="724.0" y="1017.35" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="724.0" dy="0">Quality and integrity</tspan></text><text x="723.0" y="1066.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1066.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Measure fully supported task success: required</tspan><tspan x="743.0" dy="31.05">content, correct subject/time and no material</tspan><tspan x="743.0" dy="31.05">unsupported additions.</tspan></text><text x="723.0" y="1174.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1174.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Audit admission precision/recall,</tspan><tspan x="743.0" dy="31.05">all-required-evidence coverage, citations, false</tspan><tspan x="743.0" dy="31.05">abstention and inappropriate personalization.</tspan></text><text x="723.0" y="1282.65" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1282.65" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Test source fallback, corrections, forgetting, stale</tspan><tspan x="743.0" dy="31.05">jobs/answers, cross-user scope, hostile history and</tspan><tspan x="743.0" dy="31.05">actual tool outcomes.</tspan></text><text x="723.0" y="1390.8000000000002" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1390.8000000000002" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Proposed gates: ≥95% admitted precision; ≥80%</tspan><tspan x="743.0" dy="31.05">eligible recall; ≥34/40 supported answers; ≥9/10</tspan><tspan x="743.0" dy="31.05">correct insufficient-history fallbacks.</tspan></text><text x="723.0" y="1498.9500000000003" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="723.0" dy="0">•</tspan></text><text x="743.0" y="1498.9500000000003" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="743.0" dy="0">Critical failures must be zero: wrong-person or</tspan><tspan x="743.0" dy="31.05">invented-authority writes, cross-user or</tspan><tspan x="743.0" dy="31.05">excluded-content release, and false success.</tspan></text><rect x="1328.0" y="967.35" width="600.0" height="634.75" rx="14" fill="#ffffff" stroke="#ccd9cf" stroke-width="1.5"/><text x="1352.0" y="1017.35" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"><tspan x="1352.0" dy="0">Operations and honest claims</tspan></text><text x="1351.0" y="1066.35" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1066.35" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Report retrieval and full-response latency, cold</tspan><tspan x="1371.0" dy="31.05">starts, failures, indexing lag, database/model size,</tspan><tspan x="1371.0" dy="31.05">calls, tokens and cost basis.</tspan></text><text x="1351.0" y="1174.5" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1174.5" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Proposed targets: warm retrieval p95 ≤500 ms; full</tspan><tspan x="1371.0" dy="31.05">response p50 ≤5 s / p95 ≤15 s. None is measured</tspan><tspan x="1371.0" dy="31.05">yet.</tspan></text><text x="1351.0" y="1282.65" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1282.65" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Proposed budget: 320 reader attempts; extraction,</tspan><tspan x="1371.0" dy="31.05">encoding and judging have separate budgets. An</tspan><tspan x="1371.0" dy="31.05">exhausted run is incomplete.</tspan></text><text x="1351.0" y="1390.8000000000002" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1351.0" dy="0">•</tspan></text><text x="1371.0" y="1390.8000000000002" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"><tspan x="1371.0" dy="0">Only the isolated storage probe has passed 12/12.</tspan><tspan x="1371.0" dy="31.05">Product quality, real concurrency, recovery and</tspan><tspan x="1371.0" dy="31.05">performance remain untested.</tspan></text><rect x="72" y="1630.1" width="1856" height="144.8" rx="14" fill="#f0f5f0" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1666.1" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">ILLUSTRATIVE EXAMPLE</tspan></text><text x="96" y="1703.1" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">A fluent answer with the wrong person&#x27;s budget fails. So does a correct number supported by the wrong source, a historical value presented as current, or an answer that</tspan><tspan x="96" dy="32.400000000000006">recovers forgotten information.</tspan></text><rect x="72" y="1794.8999999999999" width="1856" height="144.8" rx="14" fill="#fff0cf" stroke="#ccd9cf" stroke-width="1.5"/><text x="96" y="1830.8999999999999" fill="#1d6b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="96" dy="0">REMAINING WORK / DECISION</tspan></text><text x="96" y="1867.8999999999999" fill="#354c41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400"><tspan x="96" dy="0">Build corpus, annotations, baselines, integrity tests and results. Proposed complexity gate: ≥3 net added successes/50, or preserved quality with ≥20% lower p95 latency or</tspan><tspan x="96" dy="32.400000000000006">intended-horizon cost; no critical or temporal regression. Small differences may be inconclusive.</tspan></text><text x="72" y="1985.6999999999998" fill="#17382d" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700"><tspan x="72" dy="0">MENTOR DISCUSSION What evidence would convince us that structured memory improves the task enough to justify its errors and cost?</tspan></text><path d="M 72,2021.1 L 1928,2021.1" fill="none" stroke="#ccd9cf" stroke-width="2.5" stroke-linejoin="round"   /><text x="72" y="2054.1" fill="#5c7065" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="72" dy="0">Source: Brief pp.4–7; architecture §12 | Canonical plan revision 1.1 | 6 September 2026</tspan></text></svg>