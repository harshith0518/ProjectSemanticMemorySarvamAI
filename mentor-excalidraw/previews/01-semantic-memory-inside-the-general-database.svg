<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="1780 0 1600 1100"><title>01 · Semantic memory inside the general database</title><rect x="1780" y="0" width="1600" height="1100" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#647d73"/></marker></defs><text x="1816" y="68" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="36"><tspan x="1816" dy="0">01 Semantic memory inside the general database</tspan></text><text x="1816" y="109" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="1816" dy="0">The database holds durable records. MemoryService decides what they mean, what is allowed and how to use them.</tspan></text><text x="1816" y="142" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="16"><tspan x="1816" dy="0">PLAN / NOT IMPLEMENTED • Canonical architecture v1.1 • 6 September 2026</tspan></text><rect x="1816" y="188" width="480" height="210" fill="#fff1cc" stroke="#647d73" rx="12"/><text x="1834" y="225" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="1834" dy="0">A · General app / source records</tspan></text><text x="1834" y="258.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="1834" dy="0">Exact source revisions and metadata</tspan><tspan x="1834" dy="26.25">Requests, conversation, runs, outcomes</tspan><tspan x="1834" dy="26.25">Jobs, operation keys and control receipts</tspan><tspan x="1834" dy="26.25">Original history survives skipped extraction.</tspan></text><rect x="2340" y="188" width="480" height="210" fill="#e3f1e8" stroke="#647d73" rx="12"/><text x="2358" y="225" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="2358" dy="0">B · Accepted memory records</tspan></text><text x="2358" y="258.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="2358" dy="0">Attributed assertions + earlier revisions</tspan><tspan x="2358" dy="26.25">Exact evidence links and dependencies</tspan><tspan x="2358" dy="26.25">Subjects, scope, time and lifecycle</tspan><tspan x="2358" dy="26.25">Supported entities / aliases / relationships</tspan></text><rect x="2864" y="188" width="480" height="210" fill="#e4eff9" stroke="#647d73" rx="12"/><text x="2882" y="225" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="2882" dy="0">C · Search representations</tspan></text><text x="2882" y="258.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="2882" dy="0">FTS5 source and memory documents</tspan><tspan x="2882" dy="26.25">Optional vectors of permitted text</tspan><tspan x="2882" dy="26.25">Supported relationship projections</tspan><tspan x="2882" dy="26.25">Rebuildable; not the only saved knowledge.</tspan></text><text x="1816" y="449" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="1816" dy="0">All three groups share ONE SQLite file and ONE permission boundary. No required graph server or separate vector database.</tspan></text><polyline points="1816,477 3344,477" fill="none" stroke="#cad7d1" stroke-width="1.6" /><text x="1816" y="525" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="24"><tspan x="1816" dy="0">WORKED EXAMPLE / one source becomes a qualified claim</tspan></text><rect x="1816" y="555" width="435" height="250" fill="#fff1cc" stroke="#647d73" rx="12"/><text x="1834" y="592" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="1834" dy="0">Exact original source</tspan></text><text x="1834" y="627.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="23"><tspan x="1834" dy="0">“For the Jaipur trip, our total hotel</tspan><tspan x="1834" dy="28.75">budget is INR 6,000.”</tspan><tspan x="1834" dy="28.75"></tspan><tspan x="1834" dy="28.75">Keep the original field, source ID,</tspan><tspan x="1834" dy="28.75">revision and exact character span.</tspan></text><rect x="2322" y="555" width="540" height="250" fill="#e3f1e8" stroke="#647d73" rx="12"/><text x="2340" y="592" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="2340" dy="0">Accepted assertion</tspan></text><text x="2340" y="626.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="2340" dy="0">Subject / scope: that Jaipur trip</tspan><tspan x="2340" dy="27.5">Predicate: total hotel budget</tspan><tspan x="2340" dy="27.5">Value / unit: 6000 / INR</tspan><tspan x="2340" dy="27.5">Category: constraint; form: semantic</tspan><tspan x="2340" dy="27.5">Speaker, time, polarity, status, revision</tspan><tspan x="2340" dy="27.5">Evidence: original source + exact span</tspan></text><rect x="2933" y="555" width="410" height="250" fill="#e4eff9" stroke="#647d73" rx="12"/><text x="2951" y="592" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="2951" dy="0">What Hey Kivi can do</tspan></text><text x="2951" y="626.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="2951" dy="0">Recall this trip’s budget.</tspan><tspan x="2951" dy="27.5">Apply it to a checklist.</tspan><tspan x="2951" dy="27.5">Show the original evidence.</tspan><tspan x="2951" dy="27.5">Later change or forget it.</tspan><tspan x="2951" dy="27.5"></tspan><tspan x="2951" dy="27.5">It does not imply a nightly budget.</tspan></text><polyline points="2259,680 2314,680" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><polyline points="2870,680 2925,680" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><rect x="1816" y="838" width="1528" height="112" fill="#fff1cc" stroke="#d0d8d0" rx="12"/><text x="1834" y="875" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="1834" dy="0">Memory anatomy: who said it + who it concerns + claim + scope + time + evidence + version.</tspan><tspan x="1834" dy="26.25">A plan stays a plan; a belief stays attributed; unknown identity or time stays unknown. Current and historical values stay distinguishable.</tspan></text><text x="1816" y="997" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="1816" dy="0">12 labels organize shared records: entities, relationships, preferences, constraints, routines, goals, plans/tasks, decisions, progress/issues, beliefs/ideas, vocabulary,</tspan><tspan x="1816" dy="25.0">resources. Labels are not isolated search routes.</tspan></text><text x="1816" y="1087" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="16"><tspan x="1816" dy="0">Source: ARCHITECTURE.md §§1–5, 9–10. Accepted interpretations are durable; indexes and supported relationship projections can be rebuilt.</tspan></text></svg>