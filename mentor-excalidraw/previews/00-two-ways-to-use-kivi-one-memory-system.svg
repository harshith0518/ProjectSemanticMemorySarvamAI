<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060"><title>00 · Two ways to use Kivi. One memory system.</title><rect x="0" y="0" width="1600" height="1060" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#647d73"/></marker></defs><text x="36" y="68" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="36"><tspan x="36" dy="0">00 Two ways to use Kivi. One memory system.</tspan></text><text x="36" y="109" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="36" dy="0">Regular Kivi writes what I say. Hey Kivi uses relevant history to help with what I ask.</tspan></text><text x="36" y="142" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="16"><tspan x="36" dy="0">PLAN / NOT IMPLEMENTED • Canonical architecture v1.1 • 6 September 2026</tspan></text><text x="36" y="199" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="36" dy="0">REGULAR KIVI / existing product context</tspan></text><rect x="36" y="219" width="255" height="127" fill="#f0f1f2" stroke="#647d73" rx="12"/><text x="54" y="256" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="54" dy="0">Dictate</tspan></text><text x="54" y="288.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="54" dy="0">“Jaipur hotel budget:</tspan><tspan x="54" dy="25.0">INR 6,000.”</tspan></text><rect x="348" y="219" width="284" height="127" fill="#f0f1f2" stroke="#647d73" rx="12"/><text x="366" y="256" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="366" dy="0">Format faithfully</tspan></text><text x="366" y="288.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="366" dy="0">Recognition + vocabulary /</tspan><tspan x="366" dy="25.0">style personalization.</tspan></text><rect x="690" y="219" width="250" height="127" fill="#f0f1f2" stroke="#647d73" rx="12"/><text x="708" y="256" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="708" dy="0">Write text</tspan></text><text x="708" y="288.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="708" dy="0">Intended text in the</tspan><tspan x="708" dy="25.0">intended destination.</tspan></text><rect x="1020" y="219" width="540" height="135" fill="#e4eff9" stroke="#647d73" rx="12"/><text x="1038" y="256" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="1038" dy="0">Our demo: import paired history</tspan></text><text x="1038" y="288.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="1038" dy="0">Raw ASR + formatted text + metadata.</tspan><tspan x="1038" dy="25.0">Validated through MemoryService.</tspan><tspan x="1038" dy="25.0">Paired versions are one observation.</tspan></text><polyline points="299,282 340,282" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><polyline points="640,282 682,282" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><polyline points="948,282 1012,282" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="7 5"/><text x="38" y="385" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="19"><tspan x="38" dy="0">Native ASR and phonetic learning are outside this assignment. Historical text never grants fresh tool authority.</tspan></text><text x="36" y="436" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="36" dy="0">HEY KIVI / the memory-powered experience to build</tspan></text><rect x="36" y="456" width="255" height="136" fill="#e4eff9" stroke="#647d73" rx="12"/><text x="54" y="493" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="54" dy="0">Ask for help</tspan></text><text x="54" y="524.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="19"><tspan x="54" dy="0">“Make a Jaipur checklist</tspan><tspan x="54" dy="23.75">using our budget.”</tspan><tspan x="54" dy="23.75">Typed input is enough.</tspan></text><rect x="348" y="456" width="325" height="136" fill="#e4eff9" stroke="#647d73" rx="12"/><text x="366" y="493" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="366" dy="0">Request coordinator</tspan></text><text x="366" y="525.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="366" dy="0">Recall → interpret → commit</tspan><tspan x="366" dy="25.0">controls → continue.</tspan></text><rect x="739" y="456" width="326" height="136" fill="#eee8f6" stroke="#647d73" rx="12"/><text x="757" y="493" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="757" dy="0">Model proposal</tspan></text><text x="757" y="525.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="757" dy="0">DeepSeek: answer, retrieve,</tspan><tspan x="757" dy="25.0">clarify or propose controls /</tspan><tspan x="757" dy="25.0">tools.</tspan></text><rect x="1130" y="456" width="430" height="136" fill="#e4eff9" stroke="#647d73" rx="12"/><text x="1148" y="493" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="1148" dy="0">Useful result</tspan></text><text x="1148" y="525.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="1148" dy="0">Answer or draft; actual tool outcome.</tspan><tspan x="1148" dy="25.0">Current instructions, evidence and visible</tspan><tspan x="1148" dy="25.0">uncertainty.</tspan></text><polyline points="299,524 340,524" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><polyline points="681,524 731,524" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><polyline points="610,600 610,639 1345,639 1345,600" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><text x="719" y="662" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="17"><tspan x="719" dy="0">Code checks freshness before publishing</tspan></text><rect x="36" y="718" width="255" height="185" fill="#e3f1e8" stroke="#647d73" rx="12"/><text x="54" y="755" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="54" dy="0">Background learner</tspan></text><text x="54" y="787.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="54" dy="0">Shared model proposes</tspan><tspan x="54" dy="25.0">supported claims.</tspan><tspan x="54" dy="25.0">Ordinary answers do not</tspan><tspan x="54" dy="25.0">wait.</tspan></text><rect x="348" y="718" width="717" height="185" fill="#e3f1e8" stroke="#647d73" rx="12"/><text x="366" y="755" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="366" dy="0">MemoryService = behavior + saved understanding</tspan></text><text x="366" y="789.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="366" dy="0">Learn / recall / inspect / remember / correct / forget.</tspan><tspan x="366" dy="27.5">Applies evidence, scope, time and permission rules.</tspan><tspan x="366" dy="27.5">Semantic memory is a logical subsystem in the application.</tspan></text><rect x="1130" y="718" width="430" height="185" fill="#fff1cc" stroke="#647d73" rx="12"/><text x="1148" y="755" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="1148" dy="0">ONE SQLite database</tspan></text><text x="1148" y="789.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="1148" dy="0">Original history + application state</tspan><tspan x="1148" dy="27.5">Accepted memories + evidence</tspan><tspan x="1148" dy="27.5">Rebuildable keyword/vector indexes</tspan></text><polyline points="440,600 440,710" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><text x="455" y="689" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="18"><tspan x="455" dy="0">recall / controls</tspan></text><polyline points="299,810 340,810" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><polyline points="1073,810 1122,810" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><polyline points="1540,362 1540,399 1581,399 1581,780 1568,780" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><rect x="36" y="934" width="1524" height="93" fill="#fff1cc" stroke="#d0d8d0" rx="12"/><text x="54" y="971" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="54" dy="0">Core idea: save the evidence; learn qualified meaning; retrieve only what helps; let the user inspect and change it.</tspan><tspan x="54" dy="26.25">Only the isolated SQLite probe has passed 12/12 checks. The product, corpus, model integration and evaluation remain unbuilt.</tspan></text><text x="36" y="1050" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="16"><tspan x="36" dy="0">Discuss 00 first. Zoom to 01 storage, 02 CRUD, 03 safeguards, 04 technology rationale and 05 next work.</tspan></text></svg>