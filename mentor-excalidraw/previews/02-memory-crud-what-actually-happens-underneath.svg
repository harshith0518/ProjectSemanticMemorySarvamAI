<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1340" viewBox="0 1260 1600 1340"><title>02 · Memory CRUD: what actually happens underneath</title><rect x="0" y="1260" width="1600" height="1340" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#647d73"/></marker></defs><text x="36" y="1328" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="36"><tspan x="36" dy="0">02 Memory CRUD: what actually happens underneath</tspan></text><text x="36" y="1369" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="36" dy="0">CRUD = create, read, update, delete. Language requests become validated operations, evidence changes and real receipts.</tspan></text><text x="36" y="1402" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="16"><tspan x="36" dy="0">PLAN / NOT IMPLEMENTED • Canonical architecture v1.1 • 6 September 2026</tspan></text><text x="36" y="1492" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="27"><tspan x="36" dy="0">C · CREATE</tspan></text><text x="36" y="1530" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="36" dy="0">Learn or explicitly</tspan><tspan x="36" dy="26.25">remember</tspan></text><rect x="253" y="1450" width="300" height="200" fill="#e3f1e8" stroke="#647d73" rx="12"/><text x="271" y="1487" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="271" dy="0">1. Keep the source</tspan></text><text x="271" y="1519.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="271" dy="0">Save exact record + revision;</tspan><tspan x="271" dy="25.0">enqueue learning durably.</tspan></text><rect x="581" y="1450" width="300" height="200" fill="#e3f1e8" stroke="#647d73" rx="12"/><text x="599" y="1487" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="599" dy="0">2. Propose small claims</tspan></text><text x="599" y="1519.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="599" dy="0">Model proposes attribution,</tspan><tspan x="599" dy="25.0">meaning and evidence.</tspan><tspan x="599" dy="25.0">Worker handles routine</tspan><tspan x="599" dy="25.0">learning.</tspan></text><rect x="909" y="1450" width="300" height="200" fill="#e3f1e8" stroke="#647d73" rx="12"/><text x="927" y="1487" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="927" dy="0">3. Validate + decide</tspan></text><text x="927" y="1519.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="927" dy="0">Check support and scope.</tspan><tspan x="927" dy="25.0">Add, revise, link, no-op,</tspan><tspan x="927" dy="25.0">preserve conflict or reject.</tspan></text><rect x="1237" y="1450" width="300" height="200" fill="#e3f1e8" stroke="#647d73" rx="12"/><text x="1255" y="1487" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="1255" dy="0">4. Commit together</tspan></text><text x="1255" y="1519.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="1255" dy="0">Memory + evidence +</tspan><tspan x="1255" dy="25.0">decisions + queued indexes.</tspan><tspan x="1255" dy="25.0">Acknowledge explicit</tspan><tspan x="1255" dy="25.0">remember only after commit.</tspan></text><polyline points="558,1534 576,1534" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><polyline points="886,1534 904,1534" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><polyline points="1214,1534 1232,1534" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><text x="253" y="1683" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="18"><tspan x="253" dy="0">Routine learning is background work. An explicit “remember” is a foreground control; skipped extraction still leaves source search.</tspan></text><text x="36" y="1767" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="27"><tspan x="36" dy="0">R · READ</tspan></text><text x="36" y="1805" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="36" dy="0">Recall for a real</tspan><tspan x="36" dy="26.25">task</tspan></text><rect x="253" y="1725" width="300" height="200" fill="#e4eff9" stroke="#647d73" rx="12"/><text x="271" y="1762" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="271" dy="0">1. Apply eligibility</tspan></text><text x="271" y="1794.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="271" dy="0">Trusted user, current</tspan><tspan x="271" dy="25.0">scope/time, visibility and</tspan><tspan x="271" dy="25.0">exclusions govern every</tspan><tspan x="271" dy="25.0">route.</tspan></text><rect x="581" y="1725" width="300" height="200" fill="#e4eff9" stroke="#647d73" rx="12"/><text x="599" y="1762" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="599" dy="0">2. Find candidates</tspan></text><text x="599" y="1794.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="599" dy="0">Keyword sources +</tspan><tspan x="599" dy="25.0">memories; optional vectors</tspan><tspan x="599" dy="25.0">and supported links add</tspan><tspan x="599" dy="25.0">candidates.</tspan></text><rect x="909" y="1725" width="300" height="200" fill="#e4eff9" stroke="#647d73" rx="12"/><text x="927" y="1762" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="927" dy="0">3. Inspect + assemble</tspan></text><text x="927" y="1794.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="927" dy="0">Read original spans.</tspan><tspan x="927" dy="25.0">Deduplicate; pack decisive</tspan><tspan x="927" dy="25.0">evidence, conflicts and</tspan><tspan x="927" dy="25.0">coverage.</tspan></text><rect x="1237" y="1725" width="300" height="200" fill="#e4eff9" stroke="#647d73" rx="12"/><text x="1255" y="1762" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="1255" dy="0">4. Answer + recheck</tspan></text><text x="1255" y="1794.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="1255" dy="0">Use current request +</tspan><tspan x="1255" dy="25.0">evidence. Refresh stale</tspan><tspan x="1255" dy="25.0">knowledge before publishing.</tspan></text><polyline points="558,1809 576,1809" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><polyline points="886,1809 904,1809" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><polyline points="1214,1809 1232,1809" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><text x="253" y="1958" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="18"><tspan x="253" dy="0">Complete lists, counts and change histories need enumeration plus source fallback. A nearest-match list cannot prove completeness.</tspan></text><text x="36" y="2042" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="27"><tspan x="36" dy="0">U · UPDATE</tspan></text><text x="36" y="2080" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="36" dy="0">Correction versus</tspan><tspan x="36" dy="26.25">change</tspan></text><rect x="253" y="2000" width="300" height="200" fill="#eee8f6" stroke="#647d73" rx="12"/><text x="271" y="2037" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="271" dy="0">1. Resolve the target</tspan></text><text x="271" y="2069.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="271" dy="0">Identify subject, property,</tspan><tspan x="271" dy="25.0">scope/time and expected</tspan><tspan x="271" dy="25.0">revision. Clarify meaningful</tspan><tspan x="271" dy="25.0">ambiguity.</tspan></text><rect x="581" y="2000" width="300" height="200" fill="#eee8f6" stroke="#647d73" rx="12"/><text x="599" y="2037" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="599" dy="0">2. Preserve meaning</tspan></text><text x="599" y="2069.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="599" dy="0">“Now 8,000” = change. “I</tspan><tspan x="599" dy="25.0">meant 8,000” = correction of</tspan><tspan x="599" dy="25.0">an earlier mistake.</tspan></text><rect x="909" y="2000" width="300" height="200" fill="#eee8f6" stroke="#647d73" rx="12"/><text x="927" y="2037" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="927" dy="0">3. Append + invalidate</tspan></text><text x="927" y="2069.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="927" dy="0">Save revised interpretation</tspan><tspan x="927" dy="25.0">and evidence; update head;</tspan><tspan x="927" dy="25.0">invalidate dependent</tspan><tspan x="927" dy="25.0">links/indexes.</tspan></text><rect x="1237" y="2000" width="300" height="200" fill="#eee8f6" stroke="#647d73" rx="12"/><text x="1255" y="2037" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="1255" dy="0">4. Commit + refresh</tspan></text><text x="1255" y="2069.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="1255" dy="0">Record receipt + knowledge</tspan><tspan x="1255" dy="25.0">revision. Future reads use</tspan><tspan x="1255" dy="25.0">the qualified updated state.</tspan></text><polyline points="558,2084 576,2084" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><polyline points="886,2084 904,2084" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><polyline points="1214,2084 1232,2084" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><text x="253" y="2233" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="18"><tspan x="253" dy="0">A real-world change preserves the old INR 6,000 historically. Latest import time and name similarity never justify overwrite.</tspan></text><text x="36" y="2317" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="27"><tspan x="36" dy="0">D · DELETE</tspan></text><text x="36" y="2355" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="36" dy="0">Forget or delete</tspan><tspan x="36" dy="26.25">source</tspan></text><rect x="253" y="2275" width="300" height="200" fill="#fff1cc" stroke="#647d73" rx="12"/><text x="271" y="2312" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="271" dy="0">1. Resolve the boundary</tspan></text><text x="271" y="2344.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="271" dy="0">Choose information and</tspan><tspan x="271" dy="25.0">known supporting spans.</tspan><tspan x="271" dy="25.0">Source deletion is a separate</tspan><tspan x="271" dy="25.0">explicit choice.</tspan></text><rect x="581" y="2275" width="300" height="200" fill="#fff1cc" stroke="#647d73" rx="12"/><text x="599" y="2312" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="599" dy="0">2. Stage the changes</tspan></text><text x="599" y="2344.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="599" dy="0">Resolve exclusions,</tspan><tspan x="599" dy="25.0">permitted text and requested</tspan><tspan x="599" dy="25.0">in-app source removal;</tspan><tspan x="599" dy="25.0">identify affected derivatives.</tspan></text><rect x="909" y="2275" width="300" height="200" fill="#fff1cc" stroke="#647d73" rx="12"/><text x="927" y="2312" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="927" dy="0">3. Commit + invalidate</tspan></text><text x="927" y="2344.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="927" dy="0">Commit exclusions, affected</tspan><tspan x="927" dy="25.0">derivatives, revision and</tspan><tspan x="927" dy="25.0">receipt together. Queue</tspan><tspan x="927" dy="25.0">rebuilding from surviving</tspan><tspan x="927" dy="25.0">evidence.</tspan></text><rect x="1237" y="2275" width="300" height="200" fill="#fff1cc" stroke="#647d73" rx="12"/><text x="1255" y="2312" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="1255" dy="0">4. Enforce on all reads</tspan></text><text x="1255" y="2344.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="1255" dy="0">Source fallback, worker</tspan><tspan x="1255" dy="25.0">completion, inspection and</tspan><tspan x="1255" dy="25.0">replay recheck current</tspan><tspan x="1255" dy="25.0">exclusions.</tspan></text><polyline points="558,2359 576,2359" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><polyline points="886,2359 904,2359" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><polyline points="1214,2359 1232,2359" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><text x="253" y="2508" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="18"><tspan x="253" dy="0">Forget can retain original history while blocking use. Delete-source removes selected in-app originals; exports/backups/provider retention are separate.</tspan></text><text x="36" y="2587" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="16"><tspan x="36" dy="0">Source: ARCHITECTURE.md §§4–9. Model proposals cannot grant ownership, force unsupported changes, invent receipts or bypass controls.</tspan></text></svg>