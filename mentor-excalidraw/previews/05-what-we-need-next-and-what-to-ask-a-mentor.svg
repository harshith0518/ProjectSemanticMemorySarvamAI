<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="1780 2700 1600 1150"><title>05 · What we need next — and what to ask a mentor</title><rect x="1780" y="2700" width="1600" height="1150" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#647d73"/></marker></defs><text x="1816" y="2768" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="36"><tspan x="1816" dy="0">05 What we need next — and what to ask a mentor</tspan></text><text x="1816" y="2809" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="1816" dy="0">The next useful result is one real cited answer from persisted history, with inspection and working controls.</tspan></text><text x="1816" y="2842" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="16"><tspan x="1816" dy="0">PLAN / NOT IMPLEMENTED • Canonical architecture v1.1 • 6 September 2026</tspan></text><rect x="1816" y="2890" width="480" height="226" fill="#f0f1f2" stroke="#647d73" rx="12"/><text x="1834" y="2927" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="1834" dy="0">Exists today</tspan></text><text x="1834" y="2961.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="1834" dy="0">Reviewed architecture + research</tspan><tspan x="1834" dy="27.5">16 detailed SVG reference diagrams</tspan><tspan x="1834" dy="27.5">Isolated SQLite contract probe: 12/12</tspan><tspan x="1834" dy="27.5"></tspan><tspan x="1834" dy="27.5">That probe does not establish product</tspan><tspan x="1834" dy="27.5">semantics, real concurrency or speed.</tspan></text><rect x="2340" y="2890" width="480" height="226" fill="#e3f1e8" stroke="#647d73" rx="12"/><text x="2358" y="2927" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="2358" dy="0">Must build</tspan></text><text x="2358" y="2961.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="2358" dy="0">Importer + migrations + source search</tspan><tspan x="2358" dy="27.5">MemoryService, worker, controls</tspan><tspan x="2358" dy="27.5">Model adapter + coordinator + traces</tspan><tspan x="2358" dy="27.5">Usable interface and evidence view</tspan><tspan x="2358" dy="27.5">Corpus, evaluation and tested runbook</tspan></text><rect x="2864" y="2890" width="480" height="226" fill="#fff1cc" stroke="#647d73" rx="12"/><text x="2882" y="2927" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="2882" dy="0">Still a decision</tspan></text><text x="2882" y="2961.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="2882" dy="0">First recurring user journey</tspan><tspan x="2882" dy="27.5">Admission / sensitive-data policy</tspan><tspan x="2882" dy="27.5">UI + application adapter framework</tspan><tspan x="2882" dy="27.5">Exact DeepSeek deployment</tspan><tspan x="2882" dy="27.5">Embedding default and quality gates</tspan></text><text x="1816" y="3170" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="24"><tspan x="1816" dy="0">BUILD ORDER / each milestone produces inspectable evidence</tspan></text><rect x="1816" y="3196" width="285" height="200" fill="#e4eff9" stroke="#647d73" rx="12"/><text x="1834" y="3233" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="1834" dy="0">1 · Define behavior</tspan></text><text x="1834" y="3265.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="1834" dy="0">One useful journey plus</tspan><tspan x="1834" dy="25.0">ambiguous, corrected,</tspan><tspan x="1834" dy="25.0">forgotten and failed cases.</tspan></text><rect x="2127" y="3196" width="285" height="200" fill="#e4eff9" stroke="#647d73" rx="12"/><text x="2145" y="3233" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="2145" dy="0">2 · Source-first core</tspan></text><text x="2145" y="3265.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="2145" dy="0">Persist, import, inspect and</tspan><tspan x="2145" dy="25.0">keyword-search. Prove</tspan><tspan x="2145" dy="25.0">restart and reimport.</tspan></text><rect x="2438" y="3196" width="285" height="200" fill="#e4eff9" stroke="#647d73" rx="12"/><text x="2456" y="3233" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="2456" dy="0">3 · Real answer +</tspan><tspan x="2456" dy="27.5">controls</tspan></text><text x="2456" y="3293.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="2456" dy="0">Connect model; cite</tspan><tspan x="2456" dy="25.0">sources; correct/forget;</tspan><tspan x="2456" dy="25.0">show actual saved status.</tspan></text><rect x="2749" y="3196" width="285" height="200" fill="#e4eff9" stroke="#647d73" rx="12"/><text x="2767" y="3233" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="2767" dy="0">4 · Add measured</tspan><tspan x="2767" dy="27.5">memory</tspan></text><text x="2767" y="3293.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="2767" dy="0">Selective extraction and</tspan><tspan x="2767" dy="25.0">qualified updates; compare</tspan><tspan x="2767" dy="25.0">optional vector recall.</tspan></text><rect x="3060" y="3196" width="285" height="200" fill="#e4eff9" stroke="#647d73" rx="12"/><text x="3078" y="3233" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="3078" dy="0">5 · Finish and verify</tspan></text><text x="3078" y="3265.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="3078" dy="0">Final UI; justified tool; ~500</tspan><tspan x="3078" dy="25.0">records; frozen evaluation;</tspan><tspan x="3078" dy="25.0">clean-checkout review.</tspan></text><polyline points="2105,3288 2123,3288" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><polyline points="2416,3288 2434,3288" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><polyline points="2727,3288 2745,3288" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><polyline points="3038,3288 3056,3288" fill="none" stroke="#647d73" stroke-width="1.6" marker-end="url(#a)"/><rect x="1816" y="3413" width="1528" height="130" fill="#fff1cc" stroke="#d0d8d0" rx="12"/><text x="1834" y="3450" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="1834" dy="0">MENTOR DECISIONS</tspan><tspan x="1834" dy="26.25">1. Which recurring task is valuable enough to lead? 2. What should be learned, ignored or clarified?</tspan><tspan x="1834" dy="26.25">3. Which errors would break trust? 4. What measured gain justifies vectors or richer relationship retrieval?</tspan></text><rect x="1816" y="3574" width="746" height="180" fill="#e3f1e8" stroke="#647d73" rx="12"/><text x="1834" y="3611" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="1834" dy="0">Proof the assignment expects</tspan></text><text x="1834" y="3644.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="1834" dy="0">Approximately 500 paired history records; unfamiliar-corpus import;</tspan><tspan x="1834" dy="26.25">sources, failures, quality, latency, growth and cost; final normal-user UI. A</tspan><tspan x="1834" dy="26.25">CLI is an intermediate step.</tspan></text><rect x="2597" y="3574" width="747" height="180" fill="#e3f1e8" stroke="#647d73" rx="12"/><text x="2615" y="3611" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="2615" dy="0">Reproducible submission</tspan></text><text x="2615" y="3644.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="2615" dy="0">README + exact RUN.md; schema/migrations/seed; generated results;</tspan><tspan x="2615" dy="26.25">tested setup/import/query/inspect/evaluate/reset; repository URL + final</tspan><tspan x="2615" dy="26.25">commit SHA.</tspan></text><text x="1816" y="3798" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="18"><tspan x="1816" dy="0">Part One position/vision must be independently formed and written by the applicant before Part Two. This AI-assisted board is technical planning material.</tspan></text><text x="1816" y="3839" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="16"><tspan x="1816" dy="0">Source: assignment brief pp.2–7; ARCHITECTURE.md §§0.3, 12, 14–16. Examples are illustrative, not a finalized product narrative.</tspan></text></svg>