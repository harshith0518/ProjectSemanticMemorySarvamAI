<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="1780 1260 1600 1240"><title>03 · Why the design should stay correct</title><rect x="1780" y="1260" width="1600" height="1240" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#647d73"/></marker></defs><text x="1816" y="1328" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="36"><tspan x="1816" dy="0">03 Why the design should stay correct</tspan></text><text x="1816" y="1369" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="1816" dy="0">These are proposed engineering guarantees to implement and test. Each exists because a plausible shortcut fails.</tspan></text><text x="1816" y="1402" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="16"><tspan x="1816" dy="0">PLAN / NOT IMPLEMENTED • Canonical architecture v1.1 • 6 September 2026</tspan></text><rect x="1816" y="1451" width="488" height="286" fill="#e3f1e8" stroke="#647d73" rx="12"/><text x="1834" y="1488" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="1834" dy="0">1 · Evidence before abstraction</tspan></text><text x="1834" y="1521.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="1834" dy="0">Problem: extraction misses useful history.</tspan><tspan x="1834" dy="26.25">Approach: save originals; search permitted</tspan><tspan x="1834" dy="26.25">sources independently; preserve exact</tspan><tspan x="1834" dy="26.25">support.</tspan><tspan x="1834" dy="26.25">Test: an unclassified record still answers a</tspan><tspan x="1834" dy="26.25">supported question.</tspan></text><rect x="2334" y="1451" width="488" height="286" fill="#e3f1e8" stroke="#647d73" rx="12"/><text x="2352" y="1488" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="2352" dy="0">2 · Qualified, versioned meaning</tspan></text><text x="2352" y="1521.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="2352" dy="0">Problem: wrong person, stale value or invented</tspan><tspan x="2352" dy="26.25">fact.</tspan><tspan x="2352" dy="26.25">Approach: attribution + scope + time + modality</tspan><tspan x="2352" dy="26.25">+ evidence; preserve conflicts and supported</tspan><tspan x="2352" dy="26.25">history.</tspan><tspan x="2352" dy="26.25">Test: “might visit” never becomes “visited”.</tspan></text><rect x="2852" y="1451" width="488" height="286" fill="#e3f1e8" stroke="#647d73" rx="12"/><text x="2870" y="1488" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="2870" dy="0">3 · One permitted-text boundary</tspan></text><text x="2870" y="1521.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="2870" dy="0">Problem: forgotten meaning returns through</tspan><tspan x="2870" dy="26.25">fallback or vectors.</tspan><tspan x="2870" dy="26.25">Approach: all reads and stale completions</tspan><tspan x="2870" dy="26.25">apply current exclusions and span mappings.</tspan><tspan x="2870" dy="26.25">Test: source search and replay cannot recover</tspan><tspan x="2870" dy="26.25">it.</tspan></text><rect x="1816" y="1768" width="488" height="286" fill="#e4eff9" stroke="#647d73" rx="12"/><text x="1834" y="1805" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="1834" dy="0">4 · Hold live input before learning</tspan></text><text x="1834" y="1838.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="1834" dy="0">Problem: “forget my INR 6,000 budget”</tspan><tspan x="1834" dy="26.25">relearns the budget.</tspan><tspan x="1834" dy="26.25">Approach: private current source + held job;</tspan><tspan x="1834" dy="26.25">resolve controls; release surviving text only.</tspan><tspan x="1834" dy="26.25">Test: no new eligible copy from the forget</tspan><tspan x="1834" dy="26.25">request.</tspan></text><rect x="2334" y="1768" width="488" height="286" fill="#e4eff9" stroke="#647d73" rx="12"/><text x="2352" y="1805" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="2352" dy="0">5 · Atomic + repeat-safe operations</tspan></text><text x="2352" y="1838.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="2352" dy="0">Problem: partial writes or retries duplicate</tspan><tspan x="2352" dy="26.25">state.</tspan><tspan x="2352" dy="26.25">Approach: short transactions, stable operation</tspan><tspan x="2352" dy="26.25">keys, expected revisions and fenced worker</tspan><tspan x="2352" dy="26.25">attempts.</tspan><tspan x="2352" dy="26.25">Test: stale worker cannot replace a newer</tspan><tspan x="2352" dy="26.25">correction.</tspan></text><rect x="2852" y="1768" width="488" height="286" fill="#e4eff9" stroke="#647d73" rx="12"/><text x="2870" y="1805" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="2870" dy="0">6 · Fresh answers + real tool outcomes</tspan></text><text x="2870" y="1838.5" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="2870" dy="0">Problem: correction races an answer, or a</tspan><tspan x="2870" dy="26.25">timeout hides an executed effect.</tspan><tspan x="2870" dy="26.25">Approach: recheck publication; code verifies</tspan><tspan x="2870" dy="26.25">authority and receipts; reconcile unknown</tspan><tspan x="2870" dy="26.25">effects.</tspan><tspan x="2870" dy="26.25">Test: no false “saved” or duplicate blind retry.</tspan></text><rect x="1816" y="2106" width="1528" height="94" fill="#fff1cc" stroke="#d0d8d0" rx="12"/><text x="1834" y="2143" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="1834" dy="0">LIVE ORDER: private input + held job → retrieve → model proposal → commit controls → release only allowed learning → continue → check freshness +</tspan><tspan x="1834" dy="26.25">save answer → deliver / current-eligible replay.</tspan></text><text x="1816" y="2247" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="1816" dy="0">Freshness token = the knowledge versions used for an answer. Any meaning-changing write requires refresh. A narrow service-only exception covers</tspan><tspan x="1816" dy="26.25">publishing unchanged, already-seen input; it is not a general bypass.</tspan></text><text x="1816" y="2324" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="1816" dy="0">Operation key = one logical request. Same key + same payload reuses its receipt; changed payload conflicts. Fencing token = attempt identity that blocks a</tspan><tspan x="1816" dy="26.25">replaced worker. Model/tool calls stay outside database transactions.</tspan></text><rect x="1816" y="2380" width="1528" height="84" fill="#fff1cc" stroke="#d0d8d0" rx="12"/><text x="1834" y="2417" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="1834" dy="0">Limits and uncertainty: bounded model/read/effect attempts; ask a focused question for a material gap; otherwise give supported partial help. Previously</tspan><tspan x="1834" dy="26.25">delivered bytes cannot be recalled.</tspan></text><text x="1816" y="2488" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="16"><tspan x="1816" dy="0">Source: ARCHITECTURE.md §§5–8, 10–11. These guarantees still need actual backend, concurrency, recovery and model tests.</tspan></text></svg>