<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1863.0" viewBox="0 2700 1600 1863.0"><title>04 · Technology choices: job, reason and tradeoff</title><rect x="0" y="2700" width="1600" height="1863.0" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#647d73"/></marker></defs><text x="36" y="2768" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="36"><tspan x="36" dy="0">04 Technology choices: job, reason and tradeoff</tspan></text><text x="36" y="2809" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="36" dy="0">Keep one small local application; add complexity only when it improves the chosen task in measured comparisons.</tspan></text><text x="36" y="2842" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="16"><tspan x="36" dy="0">PLAN / NOT IMPLEMENTED • Canonical architecture v1.1 • 6 September 2026</tspan></text><rect x="36" y="2935" width="1528" height="94.0" fill="#f0f5f2" stroke="#f0f5f2" rx="12"/><text x="49" y="2965" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="49" dy="0">Python + custom coordinator</tspan></text><text x="368" y="2964" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="368" dy="0">One application coordinates requests,</tspan><tspan x="368" dy="25.0">memory, models, tools and learning.</tspan></text><text x="742" y="2964" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="742" dy="0">Makes ordering, authority and failure</tspan><tspan x="742" dy="25.0">handling explicit without a full agent</tspan><tspan x="742" dy="25.0">framework.</tspan></text><text x="1150" y="2962" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="18"><tspan x="1150" dy="0">Baseline</tspan><tspan x="1150" dy="22.5">Pin the runtime; implement and test lifecycle</tspan><tspan x="1150" dy="22.5">rules before adding framework complexity.</tspan></text><text x="49" y="3064.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="49" dy="0">SQLite + standard-library</tspan><tspan x="49" dy="26.25">sqlite3</tspan></text><text x="368" y="3063.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="368" dy="0">One local database stores source</tspan><tspan x="368" dy="25.0">history, interpreted memory, evidence,</tspan><tspan x="368" dy="25.0">revisions, jobs and operation results.</tspan></text><text x="742" y="3063.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="742" dy="0">A shared transaction boundary keeps</tspan><tspan x="742" dy="25.0">memory changes, exclusions and durable</tspan><tspan x="742" dy="25.0">work consistent with a simple reviewer</tspan><tspan x="742" dy="25.0">setup.</tspan></text><text x="1150" y="3061.0" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="18"><tspan x="1150" dy="0">Baseline; probe only</tspan><tspan x="1150" dy="22.5">Product migrations and recovery tests remain;</tspan><tspan x="1150" dy="22.5">reconsider the storage engine for multi-host or</tspan><tspan x="1150" dy="22.5">substantial concurrent writes.</tspan></text><rect x="36" y="3158.0" width="1528" height="109.0" fill="#f0f5f2" stroke="#f0f5f2" rx="12"/><text x="49" y="3188.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="49" dy="0">SQLite FTS5</tspan></text><text x="368" y="3187.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="368" dy="0">Search permitted source text and</tspan><tspan x="368" dy="25.0">memory projections for names, terms</tspan><tspan x="368" dy="25.0">and explicit phrases.</tspan></text><text x="742" y="3187.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="742" dy="0">Provides a lexical baseline and</tspan><tspan x="742" dy="25.0">independent source retrieval when</tspan><tspan x="742" dy="25.0">extraction misses useful information.</tspan></text><text x="1150" y="3185.0" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="18"><tspan x="1150" dy="0">Baseline</tspan><tspan x="1150" dy="22.5">Wording differences can reduce recall; evaluate</tspan><tspan x="1150" dy="22.5">lexical retrieval before introducing dense</tspan><tspan x="1150" dy="22.5">retrieval.</tspan></text><text x="49" y="3302.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="49" dy="0">Pydantic + application</tspan><tspan x="49" dy="26.25">validation</tspan></text><text x="368" y="3301.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="368" dy="0">Validate input and model-output</tspan><tspan x="368" dy="25.0">structure before memory admission or</tspan><tspan x="368" dy="25.0">tool execution.</tspan></text><text x="742" y="3301.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="742" dy="0">Typed contracts reject malformed values;</tspan><tspan x="742" dy="25.0">application rules enforce ownership,</tspan><tspan x="742" dy="25.0">evidence, scope and allowed transitions.</tspan></text><text x="1150" y="3299.0" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="18"><tspan x="1150" dy="0">Baseline</tspan><tspan x="1150" dy="22.5">Valid JSON and types do not establish factual</tspan><tspan x="1150" dy="22.5">truth, permission or correct interpretation.</tspan></text><rect x="36" y="3371.0" width="1528" height="109.0" fill="#f0f5f2" stroke="#f0f5f2" rx="12"/><text x="49" y="3401.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="49" dy="0">HTTPX provider adapter</tspan></text><text x="368" y="3400.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="368" dy="0">Call the hosted model with timeouts,</tspan><tspan x="368" dy="25.0">bounded retries and recorded usage.</tspan></text><text x="742" y="3400.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="742" dy="0">Contains provider-specific behavior behind</tspan><tspan x="742" dy="25.0">one replaceable interface shared by</tspan><tspan x="742" dy="25.0">answering and learning.</tspan></text><text x="1150" y="3398.0" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="18"><tspan x="1150" dy="0">Baseline</tspan><tspan x="1150" dy="22.5">Implement explicit error handling; API retry</tspan><tspan x="1150" dy="22.5">policy cannot establish whether an external tool</tspan><tspan x="1150" dy="22.5">effect occurred.</tspan></text><text x="49" y="3515.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="49" dy="0">NVIDIA-hosted DeepSeek</tspan></text><text x="368" y="3514.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="368" dy="0">Interpret candidate memories and</tspan><tspan x="368" dy="25.0">generate answers or permitted tool</tspan><tspan x="368" dy="25.0">proposals from selected evidence.</tspan></text><text x="742" y="3514.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="742" dy="0">Preserves the chosen provider while</tspan><tspan x="742" dy="25.0">keeping memory truth and execution</tspan><tspan x="742" dy="25.0">authority in application code.</tspan></text><text x="1150" y="3512.0" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="18"><tspan x="1150" dy="0">User choice; endpoint open</tspan><tspan x="1150" dy="22.5">Verify model ID, context limits, structured</tspan><tspan x="1150" dy="22.5">outputs, tool support, quotas and costs; eligible</tspan><tspan x="1150" dy="22.5">context leaves local storage.</tspan></text><rect x="36" y="3599.0" width="1528" height="109.0" fill="#f0f5f2" stroke="#f0f5f2" rx="12"/><text x="49" y="3629.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="49" dy="0">Optional</tspan><tspan x="49" dy="26.25">sentence-transformers +</tspan><tspan x="49" dy="26.25">E5-small + NumPy</tspan></text><text x="368" y="3628.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="368" dy="0">Encode permitted text locally and score</tspan><tspan x="368" dy="25.0">stored vectors for meaning-based</tspan><tspan x="368" dy="25.0">retrieval candidates.</tspan></text><text x="742" y="3628.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="742" dy="0">May recover paraphrases; exact local</tspan><tspan x="742" dy="25.0">scoring avoids a separate vector service in</tspan><tspan x="742" dy="25.0">the initial design.</tspan></text><text x="1150" y="3626.0" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="18"><tspan x="1150" dy="0">Optional; unmeasured</tspan><tspan x="1150" dy="22.5">Benchmark accuracy, languages, latency and</tspan><tspan x="1150" dy="22.5">storage; compare BGE-M3 only if useful. Vectors</tspan><tspan x="1150" dy="22.5">are not authoritative memory.</tspan></text><text x="49" y="3743.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="49" dy="0">Entity, alias and edge tables</tspan></text><text x="368" y="3742.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="368" dy="0">Connect supported identities and</tspan><tspan x="368" dy="25.0">relationships with attribution, scope,</tspan><tspan x="368" dy="25.0">time and evidence.</tspan></text><text x="742" y="3742.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="742" dy="0">Supports bounded relationship expansion</tspan><tspan x="742" dy="25.0">inside the same revision and exclusion</tspan><tspan x="742" dy="25.0">rules as other memory.</tspan></text><text x="1150" y="3740.0" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="18"><tspan x="1150" dy="0">Baseline; expansion optional</tspan><tspan x="1150" dy="22.5">Matching names do not prove identity;</tspan><tspan x="1150" dy="22.5">unresolved identities remain separate until</tspan><tspan x="1150" dy="22.5">evidence supports resolution.</tspan></text><rect x="36" y="3827.0" width="1528" height="109.0" fill="#f0f5f2" stroke="#f0f5f2" rx="12"/><text x="49" y="3857.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="49" dy="0">One durable learning worker</tspan></text><text x="368" y="3856.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="368" dy="0">Process persisted learning jobs after</tspan><tspan x="368" dy="25.0">permitted input is released; commit</tspan><tspan x="368" dy="25.0">only against current revisions.</tspan></text><text x="742" y="3856.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="742" dy="0">Keeps learning off ordinary answer latency</tspan><tspan x="742" dy="25.0">while retaining progress across</tspan><tspan x="742" dy="25.0">interruption and restart.</tspan></text><text x="1150" y="3854.0" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="18"><tspan x="1150" dy="0">Baseline</tspan><tspan x="1150" dy="22.5">Implement idempotency, attempt fencing,</tspan><tspan x="1150" dy="22.5">held-input rules, retries and recovery; stale</tspan><tspan x="1150" dy="22.5">workers must not restore forgotten knowledge.</tspan></text><text x="49" y="3971.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="49" dy="0">argparse + persistent REPL</tspan></text><text x="368" y="3970.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="368" dy="0">Import records, query memory and</tspan><tspan x="368" dy="25.0">inspect controls through the same core</tspan><tspan x="368" dy="25.0">application.</tspan></text><text x="742" y="3970.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="742" dy="0">Makes the complete backend path</tspan><tspan x="742" dy="25.0">repeatable before investing in the final</tspan><tspan x="742" dy="25.0">interface.</tspan></text><text x="1150" y="3968.0" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="18"><tspan x="1150" dy="0">CLI milestone</tspan><tspan x="1150" dy="22.5">CLI alone does not satisfy the assignment; a</tspan><tspan x="1150" dy="22.5">working normal-user interface remains required.</tspan></text><rect x="36" y="4040.0" width="1528" height="119.0" fill="#f0f5f2" stroke="#f0f5f2" rx="12"/><text x="49" y="4070.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="49" dy="0">Final UI + application/HTTP</tspan><tspan x="49" dy="26.25">adapter</tspan></text><text x="368" y="4069.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="368" dy="0">Expose imported dictation history,</tspan><tspan x="368" dy="25.0">typed Hey Kivi requests, inspectable</tspan><tspan x="368" dy="25.0">sources and ordinary-language</tspan><tspan x="368" dy="25.0">memory controls.</tspan></text><text x="742" y="4069.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="742" dy="0">Lets the mentor and reviewers experience</tspan><tspan x="742" dy="25.0">the product while reusing one memory</tspan><tspan x="742" dy="25.0">implementation.</tspan></text><text x="1150" y="4067.0" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="18"><tspan x="1150" dy="0">Required; undecided</tspan><tspan x="1150" dy="22.5">Choose web or desktop around the first journey;</tspan><tspan x="1150" dy="22.5">FastAPI and React are not selected</tspan><tspan x="1150" dy="22.5">dependencies.</tspan></text><text x="49" y="4194.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="49" dy="0">Local tool registry; MCP</tspan><tspan x="49" dy="26.25">deferred</tspan></text><text x="368" y="4193.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="368" dy="0">Execute narrowly defined authorized</tspan><tspan x="368" dy="25.0">operations and store observed</tspan><tspan x="368" dy="25.0">outcomes separately from model</tspan><tspan x="368" dy="25.0">claims.</tspan></text><text x="742" y="4193.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="742" dy="0">Makes authority, exact arguments and</tspan><tspan x="742" dy="25.0">uncertain effects reviewable before adding</tspan><tspan x="742" dy="25.0">external connectors.</tspan></text><text x="1150" y="4191.0" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="18"><tspan x="1150" dy="0">Local first; MCP deferred</tspan><tspan x="1150" dy="22.5">Add MCP only for a selected integration;</tspan><tspan x="1150" dy="22.5">remembered requests never grant current</tspan><tspan x="1150" dy="22.5">execution authority.</tspan></text><rect x="36" y="4288.0" width="1528" height="109.0" fill="#f0f5f2" stroke="#f0f5f2" rx="12"/><text x="49" y="4318.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="49" dy="0">Graph/vector servers + Redis</tspan><tspan x="49" dy="26.25">deferred</tspan></text><text x="368" y="4317.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="368" dy="0">Future alternatives for measured</tspan><tspan x="368" dy="25.0">traversal, vector-scan or shared-cache</tspan><tspan x="368" dy="25.0">requirements.</tspan></text><text x="742" y="4317.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="742" dy="0">One local database and optional checked</tspan><tspan x="742" dy="25.0">memory views keep the initial system</tspan><tspan x="742" dy="25.0">simpler to operate and inspect.</tspan></text><text x="1150" y="4315.0" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="18"><tspan x="1150" dy="0">Deferred</tspan><tspan x="1150" dy="22.5">Add infrastructure only for demonstrated limits;</tspan><tspan x="1150" dy="22.5">any migration must revalidate ownership,</tspan><tspan x="1150" dy="22.5">exclusions, isolation and retry contracts.</tspan></text><text x="49" y="2906" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="19"><tspan x="49" dy="0">TECHNOLOGY</tspan></text><text x="368" y="2906" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="19"><tspan x="368" dy="0">JOB IN THIS PRODUCT</tspan></text><text x="742" y="2906" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="19"><tspan x="742" dy="0">WHY THIS STARTING CHOICE</tspan></text><text x="1150" y="2906" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="19"><tspan x="1150" dy="0">STATUS / TRADEOFF</tspan></text><polyline points="36,2924 1564,2924" fill="none" stroke="#cad7d1" stroke-width="1.6" /><rect x="36" y="4423.0" width="1528" height="84" fill="#fff1cc" stroke="#d0d8d0" rx="12"/><text x="54" y="4460.0" fill="#203c36" font-family="Arial,Helvetica,sans-serif" font-size="21"><tspan x="54" dy="0">Decision rule: prove a cited answer from persisted sources first. Compare full permitted history, keyword sources, hybrid sources and typed memories</tspan><tspan x="54" dy="26.25">before making optional retrieval complexity the default.</tspan></text><text x="36" y="4540.0" fill="#566b64" font-family="Arial,Helvetica,sans-serif" font-size="16"><tspan x="36" dy="0">Source: ARCHITECTURE.md §2. Reasons are design rationale, not benchmark results. Exact dependency/model versions still need pinning.</tspan></text></svg>